# Cross-namespace copy of the dedicated Grafana ClickHouse user credentials.
# The password is autogenerated in hyperdx/clickhouse-grafana-credentials
# (secret-generator; consumed by the ClickHouseInstallation users block in
# hyperdx-clickhouse.yaml). This mirrors it into monitoring so the Grafana
# pod can read it; application.kube-prometheus.yaml wires the datasource.
#
# Uses the ESO kubernetes provider pattern from python-envoy-authz.yaml and
# vikunja.yaml: a reader ServiceAccount + Role scoped to the single source
# Secret, a namespaced SecretStore, and an ExternalSecret target.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-grafana-reader
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clickhouse-grafana-reader
  namespace: hyperdx
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["clickhouse-grafana-credentials"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clickhouse-grafana-reader
  namespace: hyperdx
subjects:
  - kind: ServiceAccount
    name: clickhouse-grafana-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clickhouse-grafana-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hyperdx-clickhouse
  namespace: monitoring
spec:
  provider:
    kubernetes:
      remoteNamespace: hyperdx
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: clickhouse-grafana-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-grafana-credentials
  namespace: monitoring
spec:
  refreshInterval: 300s
  secretStoreRef:
    kind: SecretStore
    name: hyperdx-clickhouse
  target:
    name: clickhouse-grafana-credentials
  data:
    - secretKey: username
      remoteRef:
        key: clickhouse-grafana-credentials
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: clickhouse-grafana-credentials
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
