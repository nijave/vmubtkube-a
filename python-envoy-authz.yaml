---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-ha-homelab-somemissing-info-tls
  namespace: projectcontour
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  data:
  - secretKey: ca.crt
    remoteRef:
      conversionStrategy: Default
      key: ca-ha.apps.somemissing.info
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: homelab-pki
  namespace: projectcontour
spec:
  provider:
    kubernetes:
      remoteNamespace: homelab-pki
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: pki-crl-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pki-crl
  namespace: projectcontour
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: homelab-pki
  target:
    name: pki-crl
  data:
  - secretKey: crl.pem
    remoteRef:
      key: pki-crl
      property: crl.pem
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-x-proxy-secret
  namespace: projectcontour
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  data:
  - secretKey: value
    remoteRef:
      conversionStrategy: Default
      key: frigate-x-proxy-secret
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-envoy-authz
  namespace: projectcontour
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/rollout-strategy: "restart"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-envoy-authz
  template:
    metadata:
      labels:
        app: python-envoy-authz
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: python-envoy-authz
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: python-envoy-authz
        image: registry.apps.nickv.me/nijave/python-envoy-authz:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
          - name: FRIGATE_X_PROXY_SECRET
            valueFrom:
              secretKeyRef:
                name: frigate-x-proxy-secret
                key: value
          - name: HA_CA_CERTIFICATE
            valueFrom:
              secretKeyRef:
                name: ca-ha-homelab-somemissing-info-tls
                key: ca.crt
          #- name: HA_CRL
          #  valueFrom:
          #    secretKeyRef:
          #      name: pki-crl
          #      key: crl.pem
          # Tracing is opt-in in the app: it stays off until
          # OTEL_EXPORTER_OTLP_ENDPOINT is set. Export to the in-namespace
          # collector (application.otel-collector-contour.yaml, plaintext OTLP
          # gRPC) — the same one Envoy sends its spans to, so an ext_authz
          # Check lands as a child of the Envoy span for that request.
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.projectcontour:4317"
          - name: OTEL_SERVICE_NAME
            value: "python-envoy-authz"
          # Keep the /healthz startup probe out of traces. Honored by the
          # FastAPI instrumentor; matched as a substring of the request path.
          - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
            value: "healthz"
          # --- Federation (mTLS → OAuth2/OIDC), see docs/federation.md ---
          # Federation turns on only when IDP_ISSUER + SECRET_KEY +
          # PROVIDERS_FILE are all set; otherwise this stays mTLS/Frigate-only.
          # The OP is served on the HTTPS port (5001). Vikunja redeems
          # federation codes here server-to-server and trusts it via the k8s
          # ClusterIssuer CA (mounted into Vikunja); the TLS cert SANs cover
          # this name.
          - name: IDP_ISSUER
            value: "https://python-envoy-authz.projectcontour:5001"
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: vikunja-federation
                key: op-code-secret
          # The providers.yaml baked into the image is already a ${VAR} template
          # consuming exactly the VIKUNJA_* vars below — no ConfigMap needed.
          - name: PROVIDERS_FILE
            value: "/app/envoy_authz/providers.yaml"
          # Stable RSA signing key (JWKS/kid survive restarts and match across
          # both replicas). Provisioned once by cert-manager (rotationPolicy:
          # Never) and mounted read-only below; the loader skips its chmod
          # because the projected file is already 0600.
          - name: OP_KEY_PATH
            value: "/var/lib/op/op_key.pem"
          # In-cluster, plain-HTTP base the federator uses to federate/refresh
          # against Vikunja (NOT the public mTLS host).
          - name: VIKUNJA_API_BASE
            value: "http://vikunja.default.svc.cluster.local"
          - name: VIKUNJA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: vikunja-federation
                key: oauth-client-secret
          # Vikunja's service.secret (HS256): lets the federator verify an
          # incoming Vikunja bearer's signature locally before trusting it.
          - name: VIKUNJA_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: vikunja-federation
                key: service-secret
        ports:
          - name: grpc
            protocol: TCP
            containerPort: 5000
          - name: http
            protocol: TCP
            containerPort: 5001
        livenessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:5000", "-tls", "-tls-ca-cert=/var/lib/tls/ca.crt", "-tls-server-name=python-envoy-authz"]
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:5000", "-tls", "-tls-ca-cert=/var/lib/tls/ca.crt", "-tls-server-name=python-envoy-authz"]
          initialDelaySeconds: 3
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: 5001
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 6
        volumeMounts:
          - name: certificate
            mountPath: /var/lib/tls
          - name: op-signing-key
            mountPath: /var/lib/op
            readOnly: true
      volumes:
        - name: certificate
          secret:
            secretName: python-envoy-authz-tls-cert
        - name: op-signing-key
          secret:
            secretName: python-envoy-authz-op-signing-key
            # 0600 so the OP key loader treats it as already-restricted and
            # never attempts a chmod (which would fail on this read-only mount).
            # Readable because the container runs as root.
            defaultMode: 0600
            items:
              - key: tls.key
                path: op_key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 5000
    - name: http
      port: 5001
      protocol: TCP
      targetPort: 5001
  selector:
    app: python-envoy-authz
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  secretName: python-envoy-authz-tls-cert
  issuerRef:
    name: k8s
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - python-envoy-authz
    - python-envoy-authz.projectcontour
    - python-envoy-authz.projectcontour.svc.cluster.local.
---
apiVersion: projectcontour.io/v1alpha1
kind: ExtensionService
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  protocol: h2
  services:
  - name: python-envoy-authz
    port: 443
  validation:
    caSecret: cert-manager/k8s-ca
    subjectName: python-envoy-authz
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: python-envoy-authz
---
# Federation shared secrets (see docs/federation.md). Pulled from the same
# external vault as the other app secrets. The SAME service-secret and
# oauth-client-secret are also materialised in the `default` namespace for
# Vikunja (vikunja.yaml), so both sides agree on the values.
#   Required vault keys (populate before merge, or the pods stay Pending):
#     vikunja-federation-service-secret       (== Vikunja service.secret)
#     vikunja-federation-oauth-client-secret  (== Vikunja openid broker clientsecret)
#     vikunja-federation-op-code-secret       (federator OP auth-code signer)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-federation
  namespace: projectcontour
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  data:
    - secretKey: service-secret
      remoteRef:
        key: vikunja-federation-service-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: oauth-client-secret
      remoteRef:
        key: vikunja-federation-oauth-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: op-code-secret
      remoteRef:
        key: vikunja-federation-op-code-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Stable RSA private key for the federator's OP signing key. We only consume the
# generated tls.key — cert-manager is just a convenient in-cluster RSA keygen
# that persists the key in a Secret shared by both replicas. rotationPolicy:
# Never keeps the key (and the JWKS kid Vikunja caches) stable across renewals.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: op-signing-key-selfsigned
  namespace: projectcontour
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: python-envoy-authz-op-signing-key
  namespace: projectcontour
spec:
  secretName: python-envoy-authz-op-signing-key
  commonName: python-envoy-authz-op-signing-key
  duration: 87600h  # 10y — the key is what matters, not the cert
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  issuerRef:
    name: op-signing-key-selfsigned
    kind: Issuer
    group: cert-manager.io
