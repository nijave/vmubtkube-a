---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-ha-homelab-somemissing-info-tls
  namespace: projectcontour
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  data:
  - secretKey: ca.crt
    remoteRef:
      conversionStrategy: Default
      key: ca-ha.apps.somemissing.info
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: homelab-pki
  namespace: projectcontour
spec:
  provider:
    kubernetes:
      remoteNamespace: homelab-pki
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: pki-crl-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pki-crl
  namespace: projectcontour
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: homelab-pki
  target:
    name: pki-crl
  data:
  - secretKey: crl.pem
    remoteRef:
      key: pki-crl
      property: crl.pem
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-x-proxy-secret
  namespace: projectcontour
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  data:
  - secretKey: value
    remoteRef:
      conversionStrategy: Default
      key: frigate-x-proxy-secret
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-envoy-authz
  namespace: projectcontour
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/rollout-strategy: "restart"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-envoy-authz
  template:
    metadata:
      labels:
        app: python-envoy-authz
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: python-envoy-authz
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: python-envoy-authz
        # renovate: datasource=custom.private-registry depName=registry.apps.nickv.me/nijave/python-envoy-authz
        image: registry.apps.nickv.me/nijave/python-envoy-authz:latest@sha256:9ff77469cd9c84b1ec9195b548fc6246ae2f1520420c1959664cb6c3eda95211
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
          - name: FRIGATE_X_PROXY_SECRET
            valueFrom:
              secretKeyRef:
                name: frigate-x-proxy-secret
                key: value
          - name: HA_CA_CERTIFICATE
            valueFrom:
              secretKeyRef:
                name: ca-ha-homelab-somemissing-info-tls
                key: ca.crt
          #- name: HA_CRL
          #  valueFrom:
          #    secretKeyRef:
          #      name: pki-crl
          #      key: crl.pem
          # Tracing is opt-in in the app: it stays off until
          # OTEL_EXPORTER_OTLP_ENDPOINT is set. Export to the in-namespace
          # collector (application.otel-collector-contour.yaml, plaintext OTLP
          # gRPC) — the same one Envoy sends its spans to, so an ext_authz
          # Check lands as a child of the Envoy span for that request.
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.projectcontour:4317"
          - name: OTEL_SERVICE_NAME
            value: "python-envoy-authz"
          # Keep the /healthz startup probe out of traces. Honored by the
          # FastAPI instrumentor; matched as a substring of the request path.
          - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
            value: "healthz"
          # --- Federation (mTLS → OAuth2/OIDC), see docs/federation.md ---
          # Enabled only when IDP_ISSUER + SECRET_KEY + PROVIDERS_FILE are all
          # set; otherwise this stays mTLS/Frigate-only.
          - name: IDP_ISSUER
            value: "https://python-envoy-authz.projectcontour:5001"
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: vikunja-federation
                key: op-code-secret
          # Baked into the image; a ${VAR} template over the VIKUNJA_* vars.
          - name: PROVIDERS_FILE
            value: "/app/envoy_authz/providers.yaml"
          - name: OP_KEY_PATH
            value: "/var/lib/op/op_key.pem"
          # In-cluster base for federate/refresh calls (not the public mTLS host).
          - name: VIKUNJA_API_BASE
            value: "http://vikunja.default.svc.cluster.local"
          # Must equal the redirect_uri Vikunja sends at token exchange, which
          # it derives from its own service.publicurl as
          # <publicurl>/auth/openid/<provider>. The browser-bootstrap flow mints
          # the OP auth code bound to this value, but the SPA POSTs only {code}
          # to Vikunja's callback, so Vikunja redeems it with its own computed
          # redirect_uri; if the two differ the OP rejects the exchange
          # (invalid_grant, "Invalid 'redirect_uri' in request"). The default
          # (localhost:3456) only matches the federator's own server-side
          # federate() leg, which passes redirect_url in the body.
          - name: VIKUNJA_REDIRECT_URL
            value: "https://vikunja.apps.somemissing.info/auth/openid/broker"
          - name: VIKUNJA_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: vikunja-federation
                key: oauth-client-secret
          # Vikunja's service.secret, so bearers can be verified locally.
          - name: VIKUNJA_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: vikunja-federation
                key: service-secret
        ports:
          - name: grpc
            protocol: TCP
            containerPort: 5000
          - name: http
            protocol: TCP
            containerPort: 5001
        livenessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:5000", "-tls", "-tls-ca-cert=/var/lib/tls/ca.crt", "-tls-server-name=python-envoy-authz"]
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["grpc_health_probe", "-addr=:5000", "-tls", "-tls-ca-cert=/var/lib/tls/ca.crt", "-tls-server-name=python-envoy-authz"]
          initialDelaySeconds: 3
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: 5001
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 6
        volumeMounts:
          - name: certificate
            mountPath: /var/lib/tls
          - name: op-signing-key
            mountPath: /var/lib/op
            readOnly: true
      volumes:
        - name: certificate
          secret:
            secretName: python-envoy-authz-tls-cert
        - name: op-signing-key
          secret:
            secretName: python-envoy-authz-op-signing-key
            # 0600 so the key loader skips its chmod, which would fail on a
            # read-only mount.
            defaultMode: 0600
            items:
              - key: tls.key
                path: op_key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 5000
    - name: http
      port: 5001
      protocol: TCP
      targetPort: 5001
  selector:
    app: python-envoy-authz
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  secretName: python-envoy-authz-tls-cert
  issuerRef:
    name: k8s
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - python-envoy-authz
    - python-envoy-authz.projectcontour
    - python-envoy-authz.projectcontour.svc.cluster.local.
---
apiVersion: projectcontour.io/v1alpha1
kind: ExtensionService
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  protocol: h2
  services:
  - name: python-envoy-authz
    port: 443
  validation:
    caSecret: cert-manager/k8s-ca
    subjectName: python-envoy-authz
  # Envoy's default ext_authz response timeout (~200ms) is too tight for an
  # authz path that does upstream I/O: a session cache miss makes Check() do a
  # full httpx federation round-trip to Vikunja. Under that default, a slow
  # Check() is abandoned and Envoy fails closed (ext_authz_error -> 403 UAEX).
  # 5s gives a cold federation headroom; the gRPC handler pool (grpc_max_workers)
  # is what keeps the common cache-hit path off this ceiling under burst.
  timeoutPolicy:
    response: 5s
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: python-envoy-authz
  namespace: projectcontour
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: python-envoy-authz
---
# Federation shared secrets (see docs/federation.md), autogenerated in-cluster.
# service-secret and oauth-client-secret are synced into the default namespace
# for Vikunja (vikunja.yaml) via the reader RBAC below.
apiVersion: v1
kind: Secret
metadata:
  name: vikunja-federation
  namespace: projectcontour
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: service-secret,oauth-client-secret,op-code-secret
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "64"
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vikunja-federation-reader
  namespace: projectcontour
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vikunja-federation"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vikunja-federation-reader
  namespace: projectcontour
subjects:
  - kind: ServiceAccount
    name: vikunja-federation-reader
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vikunja-federation-reader
---
# cert-manager used as an in-cluster RSA keygen: only tls.key is consumed, as
# the OP signing key shared by both replicas. rotationPolicy Never keeps the
# key (and the JWKS kid Vikunja caches) stable.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: op-signing-key-selfsigned
  namespace: projectcontour
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: python-envoy-authz-op-signing-key
  namespace: projectcontour
spec:
  secretName: python-envoy-authz-op-signing-key
  commonName: python-envoy-authz-op-signing-key
  duration: 87600h  # 10y — the key is what matters, not the cert
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  issuerRef:
    name: op-signing-key-selfsigned
    kind: Issuer
    group: cert-manager.io
