apiVersion: apps/v1
kind: Deployment
metadata:
  name: contour
  namespace: projectcontour
spec:
  template:
    # Contour reads --config-path once at startup; without this annotation a
    # ConfigMap-only change (e.g. dns-lookup-family) syncs but is never picked
    # up. Reloader rolls the Deployment whenever the contour ConfigMap changes.
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: contour
    spec:
      containers:
      - name: contour
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
