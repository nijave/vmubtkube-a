apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base/contour.yaml
  - envoy-lb-service.yaml

patches:
  # Replace the upstream contour ConfigMap with local configuration
  - path: patch-configmap.yaml
  # Add resource limits to the contour Deployment
  - path: patch-contour-deployment.yaml
  # Set envoy image (private mirror), resource limits, and a surge-based
  # rolling update (maxSurge with maxUnavailable=0) for zero-downtime rollouts.
  - path: patch-envoy-daemonset.yaml
  # Drop vestigial envoy listener hostPorts (80/443). They predate the
  # Calico-BGP LoadBalancer setup: kube-proxy now DNATs the VIP to the pod
  # containerPort, and hostPorts block DaemonSet maxSurge (two pods can't
  # bind the same node port during overlap). Metrics (:8002) are scraped via
  # the containerPort, so that hostPort (formerly added above) is gone too.
  - target:
      kind: DaemonSet
      name: envoy
      namespace: projectcontour
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/1/ports/0/hostPort
      - op: remove
        path: /spec/template/spec/containers/1/ports/1/hostPort
  # Change the upstream envoy Service from LoadBalancer to ClusterIP
  # (external traffic uses the separate envoy-lb Service instead)
  - target:
      kind: Service
      name: envoy
      namespace: projectcontour
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/externalTrafficPolicy
  # ArgoCD cannot update an existing completed Job; Replace+Force deletes
  # and recreates it on each sync
  - target:
      kind: Job
      namespace: projectcontour
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: "Replace=true,Force=true"
      # The API server defaults fieldRef.apiVersion to v1, and ObjectFieldSelector
      # is x-kubernetes-map-type: atomic, so omitting it makes desired != live on a
      # whole-value comparison. Because Replace=true writes via Update (owner
      # "argocd-application-controller") rather than Apply, a server-side apply then
      # conflicts on this field. Pinning the defaulted value is a semantic no-op that
      # keeps desired == live.
      # NOTE: these paths are index-based because the Job name embeds the Contour
      # version, so the target cannot select by name. Recheck the indices on a
      # vendir bump if certgen gains containers or env vars.
      - op: add
        path: /spec/template/spec/containers/0/env/0/valueFrom/fieldRef/apiVersion
        value: v1
