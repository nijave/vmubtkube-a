---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: cross-seed-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-repo-cross-seed
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        RESTIC_REPOSITORY: s3:https://vmubthh01.s.nickv.me:/volsync-cross-seed
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
  - secretKey: password
    remoteRef:
      key: volsync-restic-password-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: accessKey
    remoteRef:
      key: volsync-restic-repo-id-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: secretKey
    remoteRef:
      key: volsync-restic-repo-secret-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: cross-seed-config
  namespace: media
spec:
  sourcePVC: cross-seed-config
  trigger:
    schedule: "*/30 * * * *"
  restic:
    pruneIntervalDays: 14
    repository: restic-repo-cross-seed
    moverSecurityContext:
      runAsUser: 1002
      runAsGroup: 1001
      fsGroup: 1001
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 3
      yearly: 0
    copyMethod: Clone
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cross-seed
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        PROWLARR_API_KEY: "{{ .apiKey }}"
  data:
  - secretKey: apiKey
    remoteRef:
      key: prowlarr-api-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: v1
kind: Service
metadata:
  name: cross-seed
  namespace: media
  labels:
    app.kubernetes.io/component: cross-seed
    app.kubernetes.io/name: cross-seed
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 2468
    targetPort: http
  selector:
    app.kubernetes.io/component: cross-seed
    app.kubernetes.io/name: cross-seed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-seed
  namespace: media
  labels:
    app.kubernetes.io/component: cross-seed
    app.kubernetes.io/name: cross-seed
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: cross-seed
      app.kubernetes.io/name: cross-seed
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cross-seed
        app.kubernetes.io/name: cross-seed
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: cross-seed
        image: ghcr.io/cross-seed/cross-seed:6@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225
        #command: [sleep,infinity]
        args: [daemon]
        env:
        - name: RTORRENT_RPC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rtorrent-rpc-auth
              key: password
        envFrom:
        - secretRef:
            name: cross-seed
        ports:
        - containerPort: 2468
          name: http
          protocol: TCP
        securityContext:
          runAsUser: 1002
          runAsGroup: 1001
          runAsNonRoot: true
        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
          readOnly: true
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 500m
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: cross-seed-config
      - name: media
        persistentVolumeClaim:
          claimName: torrent-media
