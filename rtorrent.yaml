---
# Torrent stack migration from vmubttorrent01 (Docker Compose) into the
# media namespace. Design:
# docs/superpowers/specs/2026-08-22-torrent-vm-to-k8s-design.md
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: torrent-media
spec:
  capacity:
    storage: 100Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nfs:
    server: nas.apps.somemissing.info
    path: /media/av
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: torrent-media
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Ti
  volumeName: torrent-media
  storageClassName: ""
---
# session/, watch/, rpc2/ (nginx htpasswd) and flood/ (Flood's DB) live on
# this PVC. cross-seed moved to its own Deployment/PVC (cross-seed.yaml) —
# v6 useClientTorrents reads torrents over XML-RPC and does not need this
# session dir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: rtorrent-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 4Gi
---
# The VM's live AirVPN WireGuard identity (gluetun env) from Bitwarden.
# Named ...-torrent because deluge owns gluetun-airvpn in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-rtorrent
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        VPN_SERVICE_PROVIDER: airvpn
        VPN_TYPE: wireguard
        WIREGUARD_IMPLEMENTATION: kernelspace
        SERVER_COUNTRIES: canada
        WIREGUARD_ADDRESSES: "{{ .WIREGUARD_ADDRESSES }}"
        WIREGUARD_PRESHARED_KEY: "{{ .WIREGUARD_PRESHARED_KEY }}"
        WIREGUARD_PRIVATE_KEY: "{{ .WIREGUARD_PRIVATE_KEY }}"
  data:
  - secretKey: WIREGUARD_PRIVATE_KEY
    remoteRef:
      key: gluetun-rtorrent-wireguard-private-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: WIREGUARD_PRESHARED_KEY
    remoteRef:
      key: gluetun-rtorrent-wireguard-preshared-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: WIREGUARD_ADDRESSES
    remoteRef:
      key: gluetun-rtorrent-wireguard-addresses
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: v1
kind: Secret
metadata:
  name: rtorrent-rpc-auth
  namespace: media
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "48"
type: Opaque
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-repo-rtorrent
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        RESTIC_REPOSITORY: s3:https://vmubthh01.s.nickv.me:/volsync-rtorrent
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
  - secretKey: password
    remoteRef:
      key: volsync-restic-password-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: accessKey
    remoteRef:
      key: volsync-restic-repo-id-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: secretKey
    remoteRef:
      key: volsync-restic-repo-secret-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: rtorrent-config
  namespace: media
spec:
  sourcePVC: rtorrent-config
  trigger:
    schedule: "*/30 * * * *"
  restic:
    pruneIntervalDays: 14
    repository: restic-repo-rtorrent
    moverSecurityContext:
      runAsUser: 1002
      runAsGroup: 1001
      fsGroup: 1001
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 3
      yearly: 0
    copyMethod: Clone
    # clone and cache PVCs: ephemeral class keeps them out of sanoid/syncoid
    storageClassName: zfs-generic-iscsi-csi-ephemeral
    cacheStorageClassName: zfs-generic-iscsi-csi-ephemeral
---
# XML-RPC endpoint for radarr/sonarr/prowlarr/cross-seed.
apiVersion: v1
kind: Service
metadata:
  name: rtorrent-rpc
  namespace: media
  labels:
    app.kubernetes.io/component: rtorrent
    app.kubernetes.io/name: rtorrent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: rpc
  selector:
    app.kubernetes.io/component: rtorrent
    app.kubernetes.io/name: rtorrent
---
apiVersion: v1
kind: Service
metadata:
  name: flood
  namespace: media
  annotations:
    external-dns.kubernetes.io/hostname: flood.k8s.somemissing.info
  labels:
    app.kubernetes.io/component: rtorrent
    app.kubernetes.io/name: rtorrent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: flood
  selector:
    app.kubernetes.io/component: rtorrent
    app.kubernetes.io/name: rtorrent
---
# Scraped by the in-cluster kube-prometheus (label release: prom on the
# ServiceMonitor below matches its serviceMonitorSelector, same as the arr
# ServiceMonitor in media.yaml); the scrape job label is the Service name,
# rtorrent-metrics. Peer traffic itself never touches a Service (it lands
# on the AirVPN forwarded port through the tunnel).
apiVersion: v1
kind: Service
metadata:
  name: rtorrent-metrics
  namespace: media
  labels:
    # Metadata only (does NOT appear in the pod selector): the
    # ServiceMonitor below selects on it so it matches only this Service
    # and not the other torrent Services.
    app.kubernetes.io/component: rtorrent-metrics
    app.kubernetes.io/name: rtorrent
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9135
    targetPort: metrics
  selector:
    app.kubernetes.io/component: rtorrent
    app.kubernetes.io/name: rtorrent
---
# The cutover commit deletes scrapeconfig-rtorrent-exporter.yaml (the VM
# target on the ext Prometheus) and moves rtorrent-alerts.yaml to
# release: prom with job="rtorrent-metrics" — this ServiceMonitor replaces
# it as the scrape source.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rtorrent-metrics
  namespace: media
  labels:
    release: prom
spec:
  namespaceSelector:
    matchNames:
      - media
  selector:
    matchLabels:
      app.kubernetes.io/component: rtorrent-metrics
  endpoints:
    - port: metrics
      scheme: http
      interval: 30s
---
# Single source for the VPN forwarded port so it cannot drift between the
# gluetun firewall rule and rtorrent's listen port (rendered into
# /config/vpn.rc by the rtorrent-init container). AirVPN has no
# port-forward API — gluetun only supports automatic forwarding for
# PIA/ProtonVPN/PrivateVPN/PerfectPrivacy — so the static port is pinned
# here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rtorrent-vpn
  namespace: media
data:
  FIREWALL_VPN_INPUT_PORTS: "16312"
---
# Least-loaded AirVPN server picker, run as the gluetun sidecar's command
# before gluetun starts (gluetun itself picks uniformly at random). Queries
# the public AirVPN status API, ranks Canada's healthy servers by load and
# exports SERVER_NAMES for the real gluetun entrypoint; any failure falls
# back to gluetun's random pick so the pod always gets a VPN. Testable
# outside the cluster via the AIRVPN_STATUS_URL/GLUETUN_SERVERS_JSON/
# GLUETUN_ENTRYPOINT overrides documented in the script header.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-airvpn-picker
  namespace: media
data:
  pick-airvpn-server.sh: |
    #!/bin/sh
    # airvpn-picker: pick the least-loaded healthy AirVPN server before gluetun
    # starts, then hand off to gluetun's real entrypoint.
    #
    # Runs as the gluetun container's command (native sidecar). Queries the
    # public AirVPN status API, ranks the servers matching COUNTRY by load, and
    # exports SERVER_NAMES=<winner> before exec'ing $GLUETUN_ENTRYPOINT. On any
    # failure it starts gluetun WITHOUT SERVER_NAMES so gluetun's own random
    # pick applies - this script must never leave the container without a VPN.
    #
    # Env vars (all optional):
    #   COUNTRY              country_name to match, case-insensitive (Canada)
    #   FORCED_SERVER        skip all logic, export SERVER_NAMES=$FORCED_SERVER
    #   MAX_LOAD             skip servers with currentload > MAX_LOAD (100)
    #   TOR_CHECK            skip Tor exit-node IPs (false)
    #   DNSBL_CHECK          skip DNSBL-listed exit IPs (false)
    #   MAX_ATTEMPTS         max candidates to run reputation checks on (10)
    #   AIRVPN_STATUS_URL    status API URL (https://airvpn.org/api/status/)
    #   GLUETUN_SERVERS_JSON gluetun server list (/gluetun/servers.json)
    #   GLUETUN_ENTRYPOINT   gluetun entrypoint (/gluetun-entrypoint)
    #
    # Approach adapted from shamalaya83/airvpn_gluetun
    # (pick_best_airvpn.sh @ 8e6427e).

    set -u

    COUNTRY=${COUNTRY:-Canada}
    FORCED_SERVER=${FORCED_SERVER:-}
    MAX_LOAD=${MAX_LOAD:-100}
    TOR_CHECK=${TOR_CHECK:-false}
    DNSBL_CHECK=${DNSBL_CHECK:-false}
    MAX_ATTEMPTS=${MAX_ATTEMPTS:-10}
    AIRVPN_STATUS_URL=${AIRVPN_STATUS_URL:-https://airvpn.org/api/status/}
    GLUETUN_SERVERS_JSON=${GLUETUN_SERVERS_JSON:-/gluetun/servers.json}
    GLUETUN_ENTRYPOINT=${GLUETUN_ENTRYPOINT:-/gluetun-entrypoint}
    TOR_EXIT_URL=https://check.torproject.org/exit-addresses

    log() {
        printf 'airvpn-picker: %s\n' "$*" >&2
    }

    # The container command passes no arguments, so the entrypoint is exec'd
    # bare ("$@" is reused below to build jq's argument list).
    exec_entrypoint() {
        exec "$GLUETUN_ENTRYPOINT"
    }

    # The only exit from this script is exec'ing the entrypoint; never exit
    # non-zero, and never leave a SERVER_NAMES behind on the fallback path.
    fallback() {
        log "WARNING: $1"
        log 'WARNING: falling back to gluetun'"'"'s own random pick (SERVER_NAMES unset)'
        unset SERVER_NAMES
        exec_entrypoint
    }

    apk_add() {
        pkg=$1
        log "installing $pkg via apk"
        apk add --no-cache "$pkg" >/dev/null 2>&1
    }

    # $1: IPv4 address. Return 0 when listed on any DNSBL.
    is_dnsbl_listed() {
        ip=$1
        rev=$(printf '%s' "$ip" | awk -F. '{print $4"."$3"."$2"."$1}')
        for bl in dnsbl.dronebl.org rbl.efnetrbl.org dnsbl.swiftbl.net combined.abuse.ch; do
            for resolver in 1.1.1.1 8.8.8.8; do
                answer=$(dig +short +time=3 +tries=1 "$rev.$bl" "@$resolver" 2>/dev/null | head -n 1)
                case $answer in
                    [0-9]*)
                        log "$ip is listed on $bl ($answer)"
                        return 0
                        ;;
                esac
            done
        done
        return 1
    }

    if [ -n "$FORCED_SERVER" ]; then
        log "FORCED_SERVER=$FORCED_SERVER is set - skipping all selection logic"
        export SERVER_NAMES="$FORCED_SERVER"
        log "exported SERVER_NAMES=$SERVER_NAMES; exec $GLUETUN_ENTRYPOINT"
        exec_entrypoint
    fi

    if ! command -v jq >/dev/null 2>&1; then
        apk_add jq || fallback 'could not install jq via apk'
    fi

    # Reputation checks need dig; install bind-tools only when they are enabled.
    if [ "$TOR_CHECK" = true ] || [ "$DNSBL_CHECK" = true ]; then
        if ! command -v dig >/dev/null 2>&1; then
            apk_add bind-tools || fallback 'could not install bind-tools via apk'
        fi
    fi

    # Tor exit list: fetched once up front; a failed fetch fails open (checks
    # pass) with a warning rather than blocking the VPN.
    TOR_NODES=''
    if [ "$TOR_CHECK" = true ]; then
        TOR_NODES=$(wget -q -T 15 -O - "$TOR_EXIT_URL" 2>/dev/null | grep '^ExitAddress ' | awk '{print $2}')
        if [ -n "$TOR_NODES" ]; then
            log "fetched $(printf '%s\n' "$TOR_NODES" | grep -c .) Tor exit addresses"
        else
            log 'WARNING: could not fetch the Tor exit list - Tor check will pass trivially this run'
        fi
    fi

    log "fetching AirVPN status from $AIRVPN_STATUS_URL"
    STATUS=$(wget -q -T 15 -O - "$AIRVPN_STATUS_URL" 2>/dev/null)
    if [ -z "$STATUS" ]; then
        fallback "AirVPN status API at $AIRVPN_STATUS_URL returned nothing"
    fi
    if ! printf '%s' "$STATUS" | jq -e '.servers | type == "array"' >/dev/null 2>&1; then
        fallback 'AirVPN status API returned empty or invalid JSON'
    fi

    # Filter and rank in a single jq program: keep servers matching the country
    # (case-insensitive), healthy, with capacity, a routable IPv4 exit and load
    # within MAX_LOAD; when gluetun's server list exists also require the name
    # to be a wireguard AirVPN server gluetun knows. Rank ascending by
    # currentload, then bw/bw_max utilization, then user count.
    COUNTRY_LC=$(printf '%s' "$COUNTRY" | tr '[:upper:]' '[:lower:]')
    JQ_FILTER='true'
    set -- --arg country "$COUNTRY_LC" --argjson max_load "$MAX_LOAD"
    if [ -f "$GLUETUN_SERVERS_JSON" ]; then
        # shellcheck disable=SC2016  # single-quoted jq expression, expanded by jq
        JQ_FILTER='any($gluetun[0].airvpn.servers[]; .vpn == "wireguard" and .server_name == $s.public_name)'
        set -- --slurpfile gluetun "$GLUETUN_SERVERS_JSON" "$@"
    else
        log "gluetun server list $GLUETUN_SERVERS_JSON not found (first boot?) - skipping the gluetun-known-server filter"
    fi

    CANDIDATES=$(printf '%s' "$STATUS" | jq -c "$@" '
        [ .servers[]
          | . as $s
          | select(
              (.country_name | strings | ascii_downcase) == $country
              and .health == "ok"
              and .currentload != null
              and .currentload <= $max_load
              and ((.bw_max // 0) | numbers) > 0
              and .ip_v4_in1 != null
              and '"$JQ_FILTER"'
            )
          | { name: .public_name, load: .currentload, bw: (.bw // 0),
              bw_max: .bw_max, bw_ratio: ((.bw // 0) / .bw_max), users: .users }
        ]
        | sort_by(.load, .bw_ratio, .users)
    ' 2>/dev/null) || CANDIDATES=''
    if [ -z "$CANDIDATES" ]; then
        fallback 'AirVPN status API query failed (invalid data or jq error)'
    fi

    COUNT=$(printf '%s' "$CANDIDATES" | jq 'length')
    if [ "$COUNT" -eq 0 ]; then
        fallback "no AirVPN servers in $COUNTRY match the criteria (health ok, bw_max>0, ip_v4_in1 set, load<=$MAX_LOAD)"
    fi
    log "$COUNT candidate(s) in $COUNTRY; top candidates (name: load%, bw/bw_max Mbit/s, users):"
    printf '%s' "$CANDIDATES" | jq -r '.[:5][] | "airvpn-picker:   \(.name): load \(.load)%, bw \(.bw)/\(.bw_max) Mbit/s, users \(.users)"'

    if [ "$TOR_CHECK" != true ] && [ "$DNSBL_CHECK" != true ]; then
        NAME=$(printf '%s' "$CANDIDATES" | jq -r '.[0].name')
        LOAD=$(printf '%s' "$CANDIDATES" | jq -r '.[0].load')
        log "reputation checks disabled - taking the first-ranked candidate $NAME (load $LOAD%)"
        export SERVER_NAMES="$NAME"
        log "exported SERVER_NAMES=$SERVER_NAMES; exec $GLUETUN_ENTRYPOINT"
        exec_entrypoint
    fi

    # Walk the ranked list, running the enabled reputation checks on each exit
    # IP until one passes (bounded by MAX_ATTEMPTS).
    ATTEMPT=0
    INDEX=0
    while [ "$INDEX" -lt "$COUNT" ]; do
        NAME=$(printf '%s' "$CANDIDATES" | jq -r ".[$INDEX].name")
        LOAD=$(printf '%s' "$CANDIDATES" | jq -r ".[$INDEX].load")
        INDEX=$((INDEX + 1))
        if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            log "reached MAX_ATTEMPTS=$MAX_ATTEMPTS reputation checks without a pass"
            break
        fi
        ATTEMPT=$((ATTEMPT + 1))

        IP=$(dig +short +time=3 +tries=1 "${NAME}_exit.airservers.org" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
        if [ -z "$IP" ]; then
            log "$NAME: could not resolve <name>_exit.airservers.org - skipping"
            continue
        fi
        log "$NAME: exit IP $IP (load $LOAD%)"

        if [ "$TOR_CHECK" = true ] && printf '%s\n' "$TOR_NODES" | grep -qxF "$IP"; then
            log "$NAME: $IP is a Tor exit node - skipping"
            continue
        fi
        if [ "$DNSBL_CHECK" = true ] && is_dnsbl_listed "$IP"; then
            log "$NAME: $IP is DNSBL-listed - skipping"
            continue
        fi

        export SERVER_NAMES="$NAME"
        log "exported SERVER_NAMES=$SERVER_NAMES; exec $GLUETUN_ENTRYPOINT"
        exec_entrypoint
    done

    fallback "none of the $ATTEMPT checked candidate(s) passed the enabled reputation checks"
---
# rTorrent's config, mounted read-only into /config/rtorrent.rc (rflood
# only writes a default rtorrent.rc when the file is missing, so this
# mount wins). Copy of the VM's rtorrent.rc with deltas commented inline;
# everything else is unchanged (logging to stdout, encryption, throttles,
# session save schedule, buffers, xmlrpc size limit).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rtorrent-rc
  namespace: media
data:
  rtorrent.rc: |
    # rTorrent config for the rflood container. Copy of the VM's
    # rtorrent.rc with these deltas (marked inline):
    #   - session/ and watch/ are created on the torrent-config PVC
    #   - session path moved to /config/session/ (VM: /mnt/config/session)
    #   - bind addresses and listen port come from /config/vpn.rc
    #   - dropped: system.daemon.set, network.scgi.open_port, both
    #     method.redirect and both method.insert=d.down.sequential* lines
    #     (rflood starts rtorrent with daemon mode and the SCGI unix
    #     socket /dev/shm/rtorrent.sock, and supplies these four lines via
    #     /app/rtorrent-fix.rc — duplicate method.insert would error)
    directory.default.set = /media/torrents
    execute.throw = sh, -c, "mkdir -p /config/session /config/watch"
    session.path.set = /config/session/
    import = /config/vpn.rc
    log.open_file = "rtorrent.log", (cat, "/dev/stdout")
    # 0.16.26 dropped the cascading severity groups (critical..debug);
    # errors/events/debug_trace replace them and do not cascade.
    log.add_output = "errors", "rtorrent.log"
    log.add_output = "events", "rtorrent.log"
    protocol.encryption.set = allow_incoming,try_outgoing,enable_retry
    network.tos.set = throughput
    pieces.hash.on_completion.set = no
    pieces.preload.min_rate.set = 50000
    protocol.pex.set = no
    throttle.global_down.max_rate.set = 0
    throttle.global_up.max_rate.set = 0
    throttle.max_peers.normal.set = 100
    throttle.max_peers.seed.set = -1
    throttle.max_uploads.global.set = 100
    throttle.min_peers.normal.set = 1
    throttle.min_peers.seed.set = -1
    schedule = session_save, 1200, 3600, ((session.save))
    method.set_key = event.download.inserted, 2_save_session, ((d.save_full_session))
    trackers.numwant.set = 100
    network.max_open_sockets.set = 4096
    network.max_open_files.set = 4096
    network.http.max_total_connections.set = 64
    network.receive_buffer.size.set = 16M
    network.send_buffer.size.set    = 16M
    network.xmlrpc.size_limit.set = 4M
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtorrent
  namespace: media
  labels:
    app.kubernetes.io/component: rtorrent
    app.kubernetes.io/name: rtorrent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: rtorrent
      app.kubernetes.io/name: rtorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rtorrent
        app.kubernetes.io/name: rtorrent
    spec:
      # No user namespace: NFS volumes do not support idmap mounts, so the
      # torrent-media PVC cannot mount under userns. Kernelspace WireGuard
      # in upstream gluetun >= v3.41 needs no /dev/net/tun, so the forked
      # image is not needed.
      terminationGracePeriodSeconds: 90
      # DNS goes through the tunnel (POC pattern); ndots=1 keeps
      # single-label names from getting search-suffixed.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.4.4
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      # Runs every boot, before gluetun, as hotio: renders
      # /config/rpc2/basic_auth_credentials (rflood otherwise generates a
      # random hotio: user for its nginx basic auth) and /config/vpn.rc
      # (rtorrent's bind addresses + listen port, imported by
      # rtorrent.rc). Writing these from the Secret/ConfigMap (not baked
      # into an image or a static file) means a rotated
      # rtorrent-rpc-auth Secret or a changed forwarded port takes effect
      # after reloader restarts the pod. The password never appears in
      # argv (piped to openssl's stdin).
      - name: rtorrent-init
        image: ghcr.io/hotio/rflood:release-0.16.26@sha256:09dae2cdcd8e905b32b98374573dee78841a9a93cb4a4e40258f47263f4ed2e3
        command:
        - sh
        - -c
        - |
          set -eu
          [ -n "$RPC_PASSWORD" ] || { echo "RPC_PASSWORD is empty" >&2; exit 1; }
          case "$LISTEN_PORT" in
            ''|*[!0-9]*) echo "LISTEN_PORT is not a number: [$LISTEN_PORT]" >&2; exit 1 ;;
          esac
          # Split WIREGUARD_ADDRESSES on commas, strip spaces and the
          # /prefix. The entry containing ':' is IPv6, the one containing
          # '.' is IPv4 (they come from the gluetun Secret; only the
          # addresses and port are echoed here — they are not secret, the
          # private key is never printed).
          addr4=''; addr6=''
          for entry in $(printf '%s' "$WIREGUARD_ADDRESSES" | tr ',' ' '); do
            addr=$(printf '%s' "$entry" | tr -d ' ')
            [ -n "$addr" ] || continue
            ip=${addr%%/*}
            case "$ip" in
              *:*) addr6=$ip ;;
              *.*) addr4=$ip ;;
              *) echo "unexpected address entry [$addr]" >&2; exit 1 ;;
            esac
          done
          [ -n "$addr4" ] || { echo "WIREGUARD_ADDRESSES has no IPv4 entry ([$WIREGUARD_ADDRESSES]) — rtorrent cannot bind" >&2; exit 1; }
          # Temp file + mv so rtorrent never sees a half-written vpn.rc.
          tmp=$(mktemp /config/vpn.rc.XXXXXX)
          {
            echo "network.bind_address.ipv4.set = $addr4"
            if [ -n "$addr6" ]; then
              echo "network.bind_address.ipv6.set = $addr6"
            fi
            echo "network.listen.port.set = $LISTEN_PORT"
            echo "network.listen.port.random = no"
          } > "$tmp"
          mv "$tmp" /config/vpn.rc
          mkdir -p /config/rpc2
          hash=$(printf '%s' "$RPC_PASSWORD" | openssl passwd -apr1 -stdin)
          printf 'admin:%s\n' "$hash" > /config/rpc2/basic_auth_credentials
          chmod 640 /config/rpc2/basic_auth_credentials
        env:
        - name: RPC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rtorrent-rpc-auth
              key: password
        - name: LISTEN_PORT
          valueFrom:
            configMapKeyRef:
              name: rtorrent-vpn
              key: FIREWALL_VPN_INPUT_PORTS
        - name: WIREGUARD_ADDRESSES
          valueFrom:
            secretKeyRef:
              name: gluetun-rtorrent
              key: WIREGUARD_ADDRESSES
        securityContext:
          runAsUser: 1002
          runAsGroup: 1001
        volumeMounts:
        - name: config
          mountPath: /config
      - name: gluetun
        image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        restartPolicy: Always
        # Pick the least-loaded healthy AirVPN server (see the
        # gluetun-airvpn-picker ConfigMap) before gluetun runs; the script
        # always execs gluetun's real entrypoint, SERVER_NAMES set or not.
        command: ["/bin/sh", "/airvpn-picker/pick-airvpn-server.sh"]
        env:
        - name: LOG_LEVEL
          value: info
        - name: COUNTRY
          value: Canada
        - name: WIREGUARD_MTU
          value: "1320"
        - name: HEALTH_SERVER_ADDRESS
          value: "0.0.0.0:9999"
        - name: HEALTH_TARGET_ADDRESSES
          value: cloudflare.com:443,google.com:443
        # In-cluster traffic to the Services DNATs into the netns and
        # traverses gluetun's INPUT chain; without these allows every
        # Service blackholes. Health server, nginx RPC2, Flood, exporter.
        - name: FIREWALL_INPUT_PORTS
          value: "9999,5000,3000,9135"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 172.16.0.0/22,192.168.208.0/20,192.168.224.0/20,192.168.240.0/28
        envFrom:
        - secretRef:
            name: gluetun-rtorrent
        - configMapRef:
            name: rtorrent-vpn
        volumeMounts:
        - name: gluetun-airvpn-picker
          mountPath: /airvpn-picker
          readOnly: true
        # gluetun writes its server list to /gluetun/servers.json on
        # startup; an emptyDir keeps it across sidecar restarts so the
        # picker's gluetun-known-server filter works from the second boot on.
        - name: gluetun-data
          mountPath: /gluetun
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        startupProbe:
          httpGet:
            path: /
            port: 9999
          initialDelaySeconds: 5
          periodSeconds: 3
          # 40 (2min) rather than 20: the airvpn-picker command runs an apk
          # install + AirVPN API call + reputation checks before gluetun
          # starts, so the health server comes up later on first boot.
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /
            port: 9999
          periodSeconds: 30
          failureThreshold: 5
        # Readiness: a failing tunnel takes the pod NotReady (startup and
        # liveness alone would just restart gluetun).
        readinessProbe:
          httpGet:
            path: /
            port: 9999
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 256Mi
            cpu: 500m
      containers:
      - name: rtorrent
        # Public hotio/rflood image (replaces the custom Arch build from
        # images/rtorrent/): rTorrent 0.16.20 built from source — the same
        # version the VM runs — with Flood bundled and nginx serving
        # /RPC2. s6-overlay starts as root and drops to PUID/PGID (hotio),
        # so runAsUser is deliberately not set here.
        image: ghcr.io/hotio/rflood:release-0.16.26@sha256:09dae2cdcd8e905b32b98374573dee78841a9a93cb4a4e40258f47263f4ed2e3
        env:
        - name: PUID
          value: "1002"
        - name: PGID
          value: "1001"
        - name: UMASK
          value: "002"
        - name: TZ
          value: Etc/UTC
        # Flood's login page: without this rflood starts Flood with no
        # authentication at all (FLOOD_AUTH defaults to false).
        - name: FLOOD_AUTH
          value: "true"
        # s6-overlay gives services 3s to stop on SIGTERM by default;
        # rtorrent's full session save (~325 torrents) needs the headroom
        # within terminationGracePeriodSeconds: 90.
        - name: S6_SERVICES_GRACETIME
          value: "60000"
        - name: S6_KILL_GRACETIME
          value: "5000"
        ports:
        - containerPort: 5000
          name: rpc
          protocol: TCP
        - containerPort: 3000
          name: flood
          protocol: TCP
        # Probes check nginx's :5000 RPC listener, not Flood: Flood is a
        # UI and must not gate the RPC Service radarr/sonarr use. rtorrent
        # wedges (2026-08-15 incident) surface through the exporter scrape
        # alert instead.
        startupProbe:
          tcpSocket:
            port: rpc
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: rpc
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: rpc
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        # rflood's CONFIG_DIR: session/, watch/, rpc2/ and flood/ (Flood's
        # DB) live here; migrated VM state lands in session/.
        - name: config
          mountPath: /config
        # ConfigMap copy of the VM's rtorrent.rc with the deltas listed in
        # the ConfigMap.
        - name: rtorrent-rc
          mountPath: /config/rtorrent.rc
          subPath: rtorrent.rc
          readOnly: true
        - name: media
          mountPath: /media
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 4Gi
            cpu: 2000m
      - name: rtorrent-exporter
        image: docker.io/aauren/rtorrent-exporter:v1.11.0@sha256:399817340a9be5e7592b79b1f5fb92450c05e9bcb057a00dc3270ca10ac92134
        command: ["/rtorrent-exporter"]
        args:
        - --rtorrent.addr=http://127.0.0.1:5000/RPC2
        - --rtorrent.trackers.enabled=false
        ports:
        - containerPort: 9135
          name: metrics
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            # 250m throttled (CPUThrottlingHigh) — see deluge's exporter.
            cpu: 1000m
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: rtorrent-config
      - name: media
        persistentVolumeClaim:
          claimName: torrent-media
      - name: rtorrent-rc
        configMap:
          name: rtorrent-rc
      - name: gluetun-airvpn-picker
        configMap:
          name: gluetun-airvpn-picker
      - name: gluetun-data
        emptyDir: {}
