# Pod-level guardrails for deluge in media, evaluated by the internal
# kube-prometheus rule set (label release: prom — this is where
# kube-state-metrics series live).
#
# In-pod equivalent of the VPN-wedge probe the rtorrent VM had: a wedged
# gluetun tunnel fails the sidecar's readinessProbe on the health server
# (:9999), which takes the pod NotReady and fires here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: deluge-guardrails
  namespace: monitoring
  labels:
    release: prom
spec:
  groups:
  - name: deluge
    rules:
    - alert: DelugePodUnavailable
      annotations:
        summary: The deluge stack has no ready pods.
        description: >-
          deploy/deluge -n media has fewer ready replicas than desired.
          Most likely the gluetun sidecar's readinessProbe on the health
          server is failing (WireGuard tunnel down/wedged) or the web UI
          isn't serving. Check 'kubectl describe pod -l
          app.kubernetes.io/component=deluge -n media' and gluetun logs
          before restarting with 'kubectl
          rollout restart deploy/deluge -n media'. A restart re-dials the
          AirVPN tunnel; peers reconnect on their own.
      expr: |
        kube_deployment_status_replicas_ready{namespace="media",deployment="deluge"}
          < kube_deployment_spec_replicas{namespace="media",deployment="deluge"}
      for: 10m
      labels:
        severity: warning
