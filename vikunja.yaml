# volsync backup for the vikunja data PVC (task attachments, avatars, project
# backgrounds and data exports). The chart-rendered PVC is `vikunja-data` in the
# default namespace; the cnpg database is backed up separately via barman (see
# cluster.default.yaml). Mirrors the restic-repo + ReplicationSource pattern the
# other stateful apps use (jellyfin, sonarr, ...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-repo-vikunja
  namespace: default
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        RESTIC_REPOSITORY: s3:https://vmubthh01.s.nickv.me:/volsync-vikunja
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
  - secretKey: password
    remoteRef:
      key: volsync-restic-password-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: accessKey
    remoteRef:
      key: volsync-restic-repo-id-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: secretKey
    remoteRef:
      key: volsync-restic-repo-secret-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: vikunja-data
  namespace: default
spec:
  sourcePVC: vikunja-data
  trigger:
    schedule: "*/30 * * * *"
  restic:
    pruneIntervalDays: 14
    repository: restic-repo-vikunja
    cacheCapacity: 1Gi
    # Match the chart's pod fsGroup so the mover can read the cloned volume.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 3
      yearly: 0
    copyMethod: Clone
---
# Vikunja's side of the mTLS → OAuth2 federation (the projectcontour side lives
# in python-envoy-authz.yaml). Same external-vault keys, so Vikunja's
# service.secret and openid `broker` clientsecret match the federator's
# VIKUNJA_SESSION_SECRET / VIKUNJA_CLIENT_SECRET. Consumed as env in
# application.vikunja.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-federation
  namespace: default
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  data:
    - secretKey: service-secret
      remoteRef:
        key: vikunja-federation-service-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: oauth-client-secret
      remoteRef:
        key: vikunja-federation-oauth-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Throwaway cert whose only purpose is to materialise the k8s ClusterIssuer CA
# (ca.crt) in the default namespace, so Vikunja trusts the federator OP's TLS
# (https://python-envoy-authz.projectcontour:5001) when redeeming federation
# codes. Same ClusterIssuer that signed the OP cert. Mounted via
# persistence.opca in application.vikunja.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vikunja-op-ca-trust
  namespace: default
spec:
  secretName: vikunja-op-ca-trust
  commonName: vikunja-op-ca-trust
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: k8s
    kind: ClusterIssuer
    group: cert-manager.io
