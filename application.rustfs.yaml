# HA rustfs: the shared S3 endpoint at https://s3.k8s.somemissing.info.
# Four pods on four workers, one 250Gi zvol each, EC:2: reads and writes
# continue with one pod down. Design, failure behaviour and the reasons behind
# the TLS and metrics layout:
# docs/superpowers/specs/2026-11-25-ha-rustfs-design.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: rustfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
  source:
    chart: rustfs
    repoURL: https://charts.rustfs.com
    # Chart and image move together: image.rustfs.tag stays unset so the image
    # follows this chart's appVersion (upstream requires upgrading both at once).
    targetRevision: 1.0.6
    helm:
      releaseName: rustfs
      valuesObject:
        # Topology is fixed at install: Kubernetes rejects changes to the
        # StatefulSet's volumeClaimTemplates. 4 drives at EC:2 read with 2 and
        # write with 3.
        replicaCount: 4
        drivesPerNode: 1
        # The chart cannot look inside an existing Secret, so it skips the
        # per-pod endpoint identity unless told to inject it.
        localEndpointHost:
          autoInject: true
        secret:
          existingSecret: rustfs-root
        config:
          rustfs:
            console_enable: "true"
            ec:
              storage_class_standard: "EC:2"
            log_level: info
            # Empty: no logs PVC and no file logging; stdout carries the logs
            # (see RUSTFS_OBS_LOG_STDOUT_ENABLED below).
            obs_log_directory: ""
            obs_environment: production
            obs_endpoint:
              enabled: true
              # Root endpoint, no path: rustfs appends /v1/metrics itself.
              base_endpoint: http://rustfs-metrics.rustfs.svc.cluster.local:4318
              metrics:
                enabled: true
                # Per-signal endpoint, used as given.
                endpoint: http://rustfs-metrics.rustfs.svc.cluster.local:4318/v1/metrics
        extraEnv:
          # envFrom alone would let rustfs start before secret-generator has
          # filled the Secret; a required secretKeyRef holds the container in
          # CreateContainerConfigError until both keys exist.
          - name: RUSTFS_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-root
                key: RUSTFS_ACCESS_KEY
          - name: RUSTFS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-root
                key: RUSTFS_SECRET_KEY
          # Overrides the chart's /opt/tls: rustfs pins one ..data generation
          # of its TLS directory, so the default and SNI identities must come
          # from a single projected volume (rustfs-tls below). The chart's own
          # tls-material volume stays mounted but unread.
          - name: RUSTFS_TLS_PATH
            value: /etc/rustfs-tls
          # In production mode the stdout mirror is off unless enabled here.
          - name: RUSTFS_OBS_LOG_STDOUT_ENABLED
            value: "true"
          - name: RUSTFS_OBS_SERVICE_NAME
            value: rustfs-ha
        extraVolumes:
          - name: rustfs-tls
            projected:
              defaultMode: 0440
              sources:
                # Default identity (peers) and outbound trust: private CA.
                - secret:
                    name: rustfs-peer
                    items:
                      - key: tls.crt
                        path: rustfs_cert.pem
                      - key: tls.key
                        path: rustfs_key.pem
                      - key: ca.crt
                        path: public.crt
                # SNI identity for clients: public certificate.
                - secret:
                    name: s3-k8s-somemissing-info-tls
                    items:
                      - key: tls.crt
                        path: s3.k8s.somemissing.info/rustfs_cert.pem
                      - key: tls.key
                        path: s3.k8s.somemissing.info/rustfs_key.pem
        extraVolumeMounts:
          - name: rustfs-tls
            mountPath: /etc/rustfs-tls
            readOnly: true
        # Switches peer URLs and the readiness probe to HTTPS. existingSecret
        # is required by the chart; rustfs reads RUSTFS_TLS_PATH instead.
        tls:
          enabled: true
          existingSecret: rustfs-peer
        # Chart default is an nginx Ingress for two rustfs.com hostnames.
        ingress:
          enabled: false
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 3Gi
        # With TLS on, liveness is a TCP check on 9000. Startup allowance is
        # initialDelaySeconds + (failureThreshold - 1) x periodSeconds = 40s,
        # over three times the slowest measured container-start-to-Ready
        # (12s: first start, full restart, and with a heal pending). Measured
        # 2026-11; re-measure if startup behaviour changes across a rustfs
        # upgrade.
        livenessProbe:
          initialDelaySeconds: 30
        storageclass:
          name: zfs-generic-iscsi-csi
          dataStorageSize: 250Gi
          pvcAnnotations:
            data:
              # Four erasure-coded drives snapshotted at different instants are
              # not a consistent backup; keep them out of NAS snapshots and
              # replication.
              democratic-csi.org/config: |
                zfs:
                  datasetProperties:
                    homelab:sanoid-skip: "true"
                    syncoid:sync: "false"
        pdb:
          create: true
          maxUnavailable: 1
        extraManifests:
          # Client-facing Service: 443 so URLs carry no port (the container
          # runs as uid 10001 and listens on 9000). ClusterIPs are LAN
          # routable; external-dns publishes the name.
          - apiVersion: v1
            kind: Service
            metadata:
              name: s3
              namespace: rustfs
              annotations:
                external-dns.kubernetes.io/hostname: s3.k8s.somemissing.info
            spec:
              type: ClusterIP
              selector:
                app.kubernetes.io/name: rustfs
                app.kubernetes.io/instance: rustfs
              ports:
                - name: https
                  port: 443
                  targetPort: endpoint
                - name: console
                  port: 9001
                  targetPort: console
          # Private CA for peer TLS. Only rustfs pods ever check it.
          - apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: rustfs-selfsigned
              namespace: rustfs
            spec:
              selfSigned: {}
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: rustfs-peer-ca
              namespace: rustfs
            spec:
              isCA: true
              commonName: rustfs-peer-ca
              secretName: rustfs-peer-ca
              duration: 87600h
              privateKey:
                algorithm: ECDSA
                size: 256
                # A routine CA renewal keeps the key, so existing leaves keep
                # verifying. A new key needs the rotation procedure in
                # README.md (full restart of all four pods).
                rotationPolicy: Never
              issuerRef:
                name: rustfs-selfsigned
                kind: Issuer
                group: cert-manager.io
          - apiVersion: cert-manager.io/v1
            kind: Issuer
            metadata:
              name: rustfs-peer-ca
              namespace: rustfs
            spec:
              ca:
                secretName: rustfs-peer-ca
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: rustfs-peer
              namespace: rustfs
            spec:
              secretName: rustfs-peer
              commonName: rustfs-peer
              dnsNames:
                - "*.rustfs-headless.rustfs.svc.cluster.local"
                - rustfs-svc.rustfs.svc.cluster.local
                - localhost
              usages:
                - server auth
                - client auth
              privateKey:
                algorithm: ECDSA
                size: 256
                rotationPolicy: Always
              issuerRef:
                name: rustfs-peer-ca
                kind: Issuer
                group: cert-manager.io
          - apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: s3-k8s-somemissing-info
              namespace: rustfs
            spec:
              secretName: s3-k8s-somemissing-info-tls
              commonName: s3.k8s.somemissing.info
              dnsNames:
                - s3.k8s.somemissing.info
              issuerRef:
                name: cert-manager-webhook-dnsimple-production
                kind: ClusterIssuer
          # rustfs only pushes OTLP. This collector is its sink and re-exposes
          # the metrics for scrape, so the Prometheus OTLP receiver (same
          # LAN-routable port as the query API) can stay off.
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: rustfs-metrics
              namespace: rustfs
            data:
              collector.yaml: |
                receivers:
                  otlp:
                    protocols:
                      http:
                        # Not 127.0.0.1 as in the CI cache sidecar: pushes
                        # arrive from other pods through the Service.
                        endpoint: 0.0.0.0:4318
                processors:
                  batch: {}
                exporters:
                  prometheus:
                    endpoint: 0.0.0.0:8889
                    resource_to_telemetry_conversion:
                      enabled: true
                service:
                  telemetry:
                    logs:
                      level: warn
                  pipelines:
                    metrics:
                      receivers: [otlp]
                      processors: [batch]
                      exporters: [prometheus]
          - apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: rustfs-metrics
              namespace: rustfs
              labels:
                app: rustfs-metrics
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: rustfs-metrics
              template:
                metadata:
                  # No app.kubernetes.io/name=rustfs label here: the chart's
                  # anti-affinity, PDB and Services select on it.
                  labels:
                    app: rustfs-metrics
                spec:
                  containers:
                    - name: otel-collector
                      # renovate: datasource=docker depName=otel/opentelemetry-collector-contrib
                      image: otel/opentelemetry-collector-contrib:0.165.0
                      args:
                        - --config=/etc/otelcol/collector.yaml
                      ports:
                        - name: otlp-http
                          containerPort: 4318
                        - name: metrics
                          containerPort: 8889
                      volumeMounts:
                        - name: config
                          mountPath: /etc/otelcol
                          readOnly: true
                      # Four pods push here, and every pod move adds a
                      # new instance id whose series the exporter keeps for
                      # five minutes. 128Mi (the CI cache sidecar's limit)
                      # was OOM-killed twice during the disruption tests.
                      resources:
                        requests:
                          cpu: 10m
                          memory: 128Mi
                        limits:
                          memory: 384Mi
                  volumes:
                    - name: config
                      configMap:
                        name: rustfs-metrics
          - apiVersion: v1
            kind: Service
            metadata:
              name: rustfs-metrics
              namespace: rustfs
              labels:
                app: rustfs-metrics
            spec:
              type: ClusterIP
              selector:
                app: rustfs-metrics
              ports:
                - name: otlp-http
                  port: 4318
                  targetPort: otlp-http
          - apiVersion: monitoring.coreos.com/v1
            kind: PodMonitor
            metadata:
              name: rustfs-metrics
              namespace: rustfs
              labels:
                # prom-kp-prometheus selects PodMonitors by release=prom;
                # .ci/validate-prom-selectors.sh fails the PR otherwise.
                release: prom
            spec:
              selector:
                matchLabels:
                  app: rustfs-metrics
              podMetricsEndpoints:
                - port: metrics
                  path: /metrics
                  interval: 30s
          # S3 and console are open to the cluster and the LAN (SigV4 and the
          # console login authenticate); peers may use any port.
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: rustfs
              namespace: rustfs
            spec:
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: rustfs
              policyTypes:
                - Ingress
              ingress:
                - ports:
                    - protocol: TCP
                      port: 9000
                    - protocol: TCP
                      port: 9001
                - from:
                    - podSelector:
                        matchLabels:
                          app.kubernetes.io/name: rustfs
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: rustfs-metrics
              namespace: rustfs
            spec:
              podSelector:
                matchLabels:
                  app: rustfs-metrics
              policyTypes:
                - Ingress
              ingress:
                - from:
                    - podSelector:
                        matchLabels:
                          app.kubernetes.io/name: rustfs
                  ports:
                    - protocol: TCP
                      port: 4318
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: monitoring
                  ports:
                    - protocol: TCP
                      port: 8889
