# Declarative mTLS client-cert PKI for Home Assistant.
#
# A single image (registry.apps.nickv.me/nijave/homelab-pki) bundles OpenTofu
# + the tofu/ config: pki_certificate_authority/pki_certificate/pki_crl/etc.
# (nijave/pki provider) express the CA import, per-device issuance, and CRL
# generation declaratively -- one `tofu` invocation reconciles everything
# (adding/removing a device is a for_each over the device map in
# homelab-pki/tofu/locals.tf, no separate reconciler needed). State lives in
# the kubernetes backend (a Secret).
#
# STAGED CUTOVER, phase 2 of 3: both containers below now run
# `tofu apply -auto-approve`. Phase 1's `tofu plan` run (kubectl logs
# job/pki-reconcile -n homelab-pki) showed exactly the expected diff: 11 to
# import (the real CA + 5 real devices' keys/certs, via tofu/imports.tf,
# byte-identical except the documented one-time private_key_pem/
# ca_certificate_pem/ca_private_key_pem pending-sets), 12 to add (the new
# kubernetes_secret_v1/pki_bundle/pki_crl resources), 6 to change (those
# pending-sets), 6 to destroy (the old serial-suffixed Secrets and old CRL
# Secret, orphaned since this config no longer declares their resource
# addresses) -- no unexpected reissues. This one apply performs all of that
# atomically and safely (see the design spec for why the ordering can't
# race). Phase 3, a follow-up change to run promptly after this apply
# succeeds once (before the CronJob's next 6-hourly run): delete
# tofu/imports.tf, locals.tf's `legacy_device_secrets`, and the `legacy-*`
# volumes/volumeMounts below -- their data sources/mounts reference Secrets
# this apply destroys, so left in place they break every later run. See
# docs/superpowers/specs/2026-08-01-homelab-pki-provider-migration-design.md's
# "Migration / cutover procedure" for the full rollout.
#
# The reconcile Job is an Argo Sync hook (runs `tofu` on each sync); the
# CronJob re-runs periodically to keep the CRL fresh. Reconciliation is
# idempotent. The CA private key is delivered from Bitwarden via ExternalSecret
# and read directly by homelab-pki/tofu/ca.tf via a kubernetes_secret_v1 data
# source (no volume mount needed); cert/CRL Secrets are tofu-managed (not
# Argo-pruned).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pki-reconciler
  namespace: homelab-pki
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pki-crl-reader
  namespace: projectcontour
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pki-reconciler
  namespace: homelab-pki
rules:
  # cert/CRL Secrets + reading pki-ca + the OpenTofu kubernetes-backend state
  # Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OpenTofu kubernetes-backend state lock.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pki-crl-reader
  namespace: homelab-pki
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pki-crl"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pki-reconciler
  namespace: homelab-pki
subjects:
  - kind: ServiceAccount
    name: pki-reconciler
    namespace: homelab-pki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pki-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pki-crl-reader
  namespace: homelab-pki
subjects:
  - kind: ServiceAccount
    name: pki-crl-reader
    namespace: projectcontour
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pki-crl-reader
---
# CA cert+key delivered from Bitwarden (ha-ca-crt / ha-ca-key). Opaque, read
# directly by homelab-pki/tofu/ca.tf's kubernetes_secret_v1 data source. Never
# in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pki-ca
  namespace: homelab-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: pki-ca
  data:
    # conversionStrategy/decodingStrategy/metadataPolicy are CRD defaults spelled
    # out explicitly: Argo owns spec.data as an atomic list and diffs
    # client-side, so omitting them reads as permanent drift.
    - secretKey: tls.crt
      remoteRef:
        key: ha-ca-crt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tls.key
      remoteRef:
        key: ha-ca-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# Immediate reconcile: Argo Sync hook runs `tofu apply` on each sync
# (idempotent -- see the staged-cutover note above for what this apply does).
apiVersion: batch/v1
kind: Job
metadata:
  name: pki-reconcile
  namespace: homelab-pki
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pki-reconciler
      containers:
        - name: reconcile
          image: registry.apps.nickv.me/nijave/homelab-pki:0.2.3
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              cd /app/tofu
              tofu init -input=false -no-color
              tofu apply -input=false -auto-approve -no-color
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            # TEMPORARY: only for tofu/imports.tf's device private-key
            # imports (file:// paths, never secret data through a value
            # OpenTofu could print) -- remove alongside imports.tf.
            - { name: legacy-kara-iphone, mountPath: /legacy/kara-iphone, readOnly: true }
            - { name: legacy-nick-desktop, mountPath: /legacy/nick-desktop, readOnly: true }
            - { name: legacy-nick-ipad, mountPath: /legacy/nick-ipad, readOnly: true }
            - { name: legacy-nick-xps, mountPath: /legacy/nick-xps, readOnly: true }
            - { name: legacy-pixel7, mountPath: /legacy/pixel7, readOnly: true }
      volumes:
        - { name: legacy-kara-iphone, secret: { secretName: pki-kara-iphone-2000 } }
        - { name: legacy-nick-desktop, secret: { secretName: pki-nick-desktop-2001 } }
        - { name: legacy-nick-ipad, secret: { secretName: pki-nick-ipad-2002 } }
        - { name: legacy-nick-xps, secret: { secretName: pki-nick-xps-2003 } }
        - { name: legacy-pixel7, secret: { secretName: pki-pixel7-2004 } }
---
# Periodic re-run to keep the CRL fresh (regenerate before nextUpdate) and
# correct any drift. concurrencyPolicy Forbid; the OpenTofu state lock also
# guards against overlap with the Sync-hook Job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pki-crl-refresh
  namespace: homelab-pki
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: pki-reconciler
          containers:
            - name: reconcile
              image: registry.apps.nickv.me/nijave/homelab-pki:0.2.3
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eux
                  cd /app/tofu
                  tofu init -input=false -no-color
                  tofu apply -input=false -auto-approve -no-color
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
              volumeMounts:
                # TEMPORARY: see the matching comment on the Job above.
                - { name: legacy-kara-iphone, mountPath: /legacy/kara-iphone, readOnly: true }
                - { name: legacy-nick-desktop, mountPath: /legacy/nick-desktop, readOnly: true }
                - { name: legacy-nick-ipad, mountPath: /legacy/nick-ipad, readOnly: true }
                - { name: legacy-nick-xps, mountPath: /legacy/nick-xps, readOnly: true }
                - { name: legacy-pixel7, mountPath: /legacy/pixel7, readOnly: true }
          volumes:
            - { name: legacy-kara-iphone, secret: { secretName: pki-kara-iphone-2000 } }
            - { name: legacy-nick-desktop, secret: { secretName: pki-nick-desktop-2001 } }
            - { name: legacy-nick-ipad, secret: { secretName: pki-nick-ipad-2002 } }
            - { name: legacy-nick-xps, secret: { secretName: pki-nick-xps-2003 } }
            - { name: legacy-pixel7, secret: { secretName: pki-pixel7-2004 } }
