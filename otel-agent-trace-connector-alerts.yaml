# Drop-detection alerts for the coding-agent ingest: the tier-1 gateway
# (otel-agent-gateway.yaml, job="otel-agent-gateway") and the tier-2
# connector replicas (otel-agent-trace-connector.yaml,
# job="otel-agent-trace-connector"). Evaluated by the kube-prometheus-stack
# Prometheus (ruleSelector matchLabels release: prom); metrics come from each
# pod's :8888 /metrics endpoint via the shared PodMonitor, which takes the job
# name from the pod's `app` label. Scrape-down coverage for both jobs already
# exists in scrape-failure-alerts-k8s (up == 0); these rules cover the silent
# failure modes scrape health cannot see.
#
# 2026-08-23 incident context: the otlp_grpc exporter permanently dropped
# oversized trace batches -- grpc ResourceExhausted above the 4 MiB message
# limit is non-retryable, so exporterhelper discards them outright. Roughly
# 14k spans/hour were lost for hours before anyone looked at pod logs;
# up == 1 throughout and no other signal showed it. Root cause fixed by the
# send_batch_size / send_batch_max_size changes (#485, #486); these rules make
# any recurrence loud. While drops were ongoing the export-drop rule read
# ~22 spans/s, so even small nonzero rates are worth treating as real.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: otel-agent-trace-connector-alerts
  namespace: monitoring
  labels:
    release: prom
spec:
  groups:
  - name: otel-agent-trace-connector
    rules:
    - alert: AgentTraceConnectorExportDrops
      annotations:
        summary: "Coding-agent trace connector dropped {{ $value | humanize }} spans/s to otel-collector."
        description: >-
          The otlp_grpc exporter is failing to send traces downstream.
          exporterhelper counts these as permanent failures and discards the
          batch, so every minute this stays up is agent telemetry gone for
          good. Known cause: batch payloads exceeding the 4 MiB gRPC message
          limit (ResourceExhausted). Check pod logs for 'Dropping data':
          kubectl -n monitoring logs -l app=otel-agent-trace-connector |
          grep -i resourceexhausted. Batch-size fixes live in the vmubtkube-a repo,
          otel-agent-trace-connector.yaml.
      expr: sum by (exporter) (rate(otelcol_exporter_send_failed_spans{job="otel-agent-trace-connector"}[10m])) > 0
      for: 5m
      labels:
        severity: critical
    - alert: AgentTraceConnectorMetricsExportFailures
      annotations:
        summary: "Coding-agent trace connector is failing to send metrics to Thanos Receive."
        description: >-
          The prometheus_remote_write exporter is failing to deliver metric
          points to thanos-receive-router. Retries absorb transient errors,
          but once the sending queue fills the points are dropped for good,
          and non-retryable 4xx rejections drop immediately. Check the pod
          logs for the exporter error and that thanos-receive-router.thanos
          is reachable and its ingestors healthy.
      expr: sum by (exporter) (rate(otelcol_exporter_send_failed_metric_points{job="otel-agent-trace-connector"}[10m])) > 0
      for: 5m
      labels:
        severity: warning
    - alert: AgentTraceConnectorMetricsTranslationFailures
      annotations:
        summary: "Coding-agent trace connector is hitting {{ $value | humanize }} metric translation errors/s before remote write."
        description: >-
          The prometheusremotewrite exporter could not translate OTLP metrics
          into Prometheus series and dropped them before sending, so
          send_failed_metric_points and AgentTraceConnectorMetricsExportFailures
          stay at zero. The usual cause is delta temporality: Claude Code
          exports delta sums and histograms by default, and remote write
          accepts only cumulative data. The metrics/agents pipeline converts
          them with delta_to_cumulative, so check first that the processor is
          still in that pipeline (otel-agent-trace-connector.yaml) and the
          pod logs for which metric failed to translate. As a client-side
          workaround, set
          OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=cumulative.
      expr: sum(rate(otelcol_exporter_prometheusremotewrite_failed_translations{job="otel-agent-trace-connector"}[10m])) > 0
      for: 5m
      labels:
        severity: warning
    - alert: AgentTraceConnectorIngestRejections
      annotations:
        summary: "Coding-agent trace connector is refusing or failing inbound telemetry."
        description: >-
          An otlp receiver in either tier rejected spans, log
          records, or metric points instead of accepting them -- refused
          means the client's request bounced (TLS, auth, size, or the
          gateway's memory_limiter), failed means it was accepted then
          errored inside the pipeline. On otel-agent-gateway the clients are
          the agents, which usually surface this as their own OTLP exporter
          errors, but headless runs may not; on otel-agent-trace-connector
          the client is the gateway, which retries and then shows up in
          AgentGatewayExportFailures. Compare otelcol_receiver_accepted_*
          against otelcol_receiver_refused_* / _failed_* for the affected
          signal.
      expr: sum(rate(otelcol_receiver_refused_spans{job=~"otel-agent-gateway|otel-agent-trace-connector"}[10m])) +
            sum(rate(otelcol_receiver_refused_log_records{job=~"otel-agent-gateway|otel-agent-trace-connector"}[10m])) +
            sum(rate(otelcol_receiver_refused_metric_points{job=~"otel-agent-gateway|otel-agent-trace-connector"}[10m])) +
            sum(rate(otelcol_receiver_failed_spans{job=~"otel-agent-gateway|otel-agent-trace-connector"}[10m])) +
            sum(rate(otelcol_receiver_failed_log_records{job=~"otel-agent-gateway|otel-agent-trace-connector"}[10m])) +
            sum(rate(otelcol_receiver_failed_metric_points{job=~"otel-agent-gateway|otel-agent-trace-connector"}[10m])) > 0
      for: 5m
      labels:
        severity: warning
  # Tier 1: the stateless gateway agents connect to. Its load_balancing
  # exporters retry per tier-2 pod, then re-hash and retry from an in-memory
  # queue; data is lost only when that retry runs out or the queue is full.
  - name: otel-agent-gateway
    rules:
    - alert: AgentGatewayExportFailures
      annotations:
        summary: "Coding-agent gateway is dropping telemetry on {{ $labels.exporter }}."
        description: >-
          A load_balancing exporter on otel-agent-gateway gave up on a batch
          after its retries (per tier-2 pod, then re-hashed from the
          exporter queue for up to 5 minutes), so the batch is gone. Usual
          cause: no ready tier-2 pod for that long. Check the
          otel-agent-trace-connector pods, the
          otel-agent-trace-connector-headless EndpointSlices, and the gateway
          logs: kubectl -n monitoring logs -l app=otel-agent-gateway.
      expr: sum by (exporter) (rate(otelcol_exporter_send_failed_spans{job="otel-agent-gateway"}[10m])) > 0
            or sum by (exporter) (rate(otelcol_exporter_send_failed_log_records{job="otel-agent-gateway"}[10m])) > 0
            or sum by (exporter) (rate(otelcol_exporter_send_failed_metric_points{job="otel-agent-gateway"}[10m])) > 0
      for: 5m
      labels:
        severity: critical
    - alert: AgentGatewayQueueFull
      annotations:
        summary: "Coding-agent gateway queue on {{ $labels.exporter }} is full and rejecting data."
        description: >-
          The exporter's in-memory sending queue (64 MiB per exporter) is
          full, so new batches are rejected and agents get errors back. Tier
          2 is down or too slow to keep up. Check
          otelcol_exporter_queue_size against otelcol_exporter_queue_capacity
          and the otel-agent-trace-connector pods.
      expr: sum by (exporter) (rate(otelcol_exporter_enqueue_failed_spans{job="otel-agent-gateway"}[10m])) > 0
            or sum by (exporter) (rate(otelcol_exporter_enqueue_failed_log_records{job="otel-agent-gateway"}[10m])) > 0
            or sum by (exporter) (rate(otelcol_exporter_enqueue_failed_metric_points{job="otel-agent-gateway"}[10m])) > 0
      for: 5m
      labels:
        severity: critical
    - alert: AgentGatewayBackendErrors
      annotations:
        summary: "Coding-agent gateway sends to {{ $labels.endpoint }} keep failing."
        description: >-
          Sends from the gateway to one tier-2 pod have failed for 15
          minutes. Each failure is retried and then re-hashed, so data is
          not lost yet (AgentGatewayExportFailures covers that), but a pod
          that stays in the EndpointSlice and does not accept data delays
          everything hashed to it. A roll of tier 2 causes a minute or two
          of this; longer means a stuck pod.
      expr: sum by (endpoint) (rate(otelcol_loadbalancer_backend_outcome{job="otel-agent-gateway", success="false"}[10m])) > 0
      for: 15m
      labels:
        severity: warning
    - alert: AgentGatewayMissingBackends
      annotations:
        summary: "Coding-agent gateway {{ $labels.pod }} sees {{ $value }} tier-2 backends."
        description: >-
          The k8s resolver sees fewer tier-2 endpoints than the 2 replicas
          otel-agent-trace-connector should run. At 0 the gateway routes
          nothing and only its queue holds data. Check that the
          otel-agent-trace-connector pods are Ready and that the gateway's
          Role can list and watch EndpointSlices (the resolver logs
          `couldn't find the exporter for the endpoint ""` when it cannot).
      expr: min by (pod) (otelcol_loadbalancer_num_backends{job="otel-agent-gateway"}) < 2
      for: 15m
      labels:
        severity: warning
