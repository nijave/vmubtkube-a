# Generic metacontroller ConfigMap -> Secret propagation, modeled on
# metacontroller's configmappropagation example (cm->cm) with Secrets as the
# child kind. ConfigMaps whose "namespace/name" appears in the mappings key are
# copied to a Secret (same data keys, base64 encoded) and kept in sync on
# changes and every 5 min.
#
# To add a use case: append "namespace/name = secret-name" to the mappings key.
#
# Current use: kube-root-ca.crt (ConfigMap maintained by the apiserver) ->
# kube-apiserver-ca Secret for Contour upstream TLS validation. Contour only
# reads Secrets, and kube-root-ca.crt only exists as a ConfigMap. External-secrets
# can stack on later if templating is needed.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-to-secret-propagator
  namespace: default
data:
  sync.py: |
    #!/usr/bin/env python3
    import base64
    import json
    import logging
    from http.server import BaseHTTPRequestHandler, HTTPServer

    logging.basicConfig(level=logging.INFO)
    LOGGER = logging.getLogger(__name__)

    MAPPINGS_PATH = '/hooks/mappings'

    def load_mappings():
        mappings = {}
        with open(MAPPINGS_PATH) as fh:
            for line in fh:
                line = line.split('#', 1)[0].strip()
                if not line:
                    continue
                key, _, name = line.partition('=')
                mappings[key.strip()] = name.strip()
        return mappings

    def new_secret(name: str, namespace: str, data: dict) -> dict:
        return {
            'apiVersion': 'v1',
            'kind': 'Secret',
            'metadata': {
                'name': name,
                'namespace': namespace,
                'labels': {'app.kubernetes.io/managed-by': 'cm-to-secret-propagator'},
            },
            'type': 'Opaque',
            'data': {key: base64.b64encode(value.encode()).decode()
                     for key, value in data.items()},
        }

    class Controller(BaseHTTPRequestHandler):
        def sync(self, parent: dict) -> list:
            meta = parent.get('metadata', {})
            data = parent.get('data') or {}
            key = f"{meta.get('namespace')}/{meta.get('name')}"
            secret_name = load_mappings().get(key)
            LOGGER.info('Processing: %s -> %s', key, secret_name or '(skip)')
            if not secret_name or not data:
                return []
            return [new_secret(secret_name, meta['namespace'], data)]

        def do_POST(self):
            if self.path == '/sync':
                observed = json.loads(self.rfile.read(
                    int(self.headers.get('content-length'))))
                # DecoratorController sends the parent under 'object';
                # CompositeController (like upstream's example) under 'parent'.
                parent = observed.get('object') or observed.get('parent') or {}
                response = {'attachments': self.sync(parent)}
                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps(response).encode('utf-8'))
            else:
                self.send_response(404)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps(
                    {'error': '404', 'endpoint': self.path}).encode('utf-8'))

        def log_message(self, *args):
            pass

    HTTPServer(('', 80), Controller).serve_forever()
  mappings: |
    # namespace/name = secret-name
    default/kube-root-ca.crt = kube-apiserver-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cm-to-secret-propagator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cm-to-secret-propagator
  template:
    metadata:
      labels:
        app: cm-to-secret-propagator
    spec:
      containers:
        - name: controller
          image: python:3.13-alpine
          command: ["python", "/hooks/sync.py"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: hooks
              mountPath: /hooks
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: hooks
          configMap:
            name: cm-to-secret-propagator
---
apiVersion: v1
kind: Service
metadata:
  name: cm-to-secret-propagator
  namespace: default
spec:
  selector:
    app: cm-to-secret-propagator
  ports:
    - port: 80
---
apiVersion: metacontroller.k8s.io/v1alpha1
kind: DecoratorController
metadata:
  name: cm-to-secret-propagator
spec:
  resources:
    - apiVersion: v1
      resource: configmaps
  attachments:
    - apiVersion: v1
      resource: secrets
      updateStrategy:
        method: InPlace
  resyncPeriodSeconds: 300
  hooks:
    sync:
      webhook:
        url: http://cm-to-secret-propagator.default/sync
