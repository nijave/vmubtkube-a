# Public OIDC endpoint for the kube-apiserver service-account token issuer at
# https://oidc-k8s.apps.somemissing.info. DNS: public CNAME in the somemissing.info
# zone (dnsimple tofu repo); internal apps.somemissing.info record via external-dns.
# Follow-up (node-level): apiservers need an AuthenticationConfiguration whose
# anonymous.conditions covers the two paths below (k8s 1.34+ allowlist), plus
# --service-account-jwks-uri pointing here for AWS IRSA.
---
# Cluster CA for Contour upstream validation. kube-root-ca.crt is a ConfigMap and
# Contour only reads Secrets, so it is copied here. Refresh if the cluster CA rotates.
apiVersion: v1
kind: Secret
metadata:
  name: kube-apiserver-ca
  namespace: default
type: Opaque
data:
  ca.crt: 
---
# Routes to the built-in default/kubernetes Service (port name https, 443 -> 6443,
# endpoints auto-maintained by the apiserver). Apiserver cert SANs include
# kubernetes.default, so upstream validation works through the ClusterIP.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oidc-k8s-apps-somemissing-info-cert
  namespace: default
spec:
  secretName: oidc-k8s-apps-somemissing-info-tls
  issuerRef:
    name: cert-manager-webhook-dnsimple-production
    kind: ClusterIssuer
  commonName: &cn oidc-k8s.apps.somemissing.info
  dnsNames:
    - *cn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: public-oidc-discovery
rules:
  - verbs:
      - get
    nonResourceURLs:
      - /.well-known/openid-configuration
      - /openid/v1/jwks
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anonymous-public-oidc-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: public-oidc-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:anonymous
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: kube-apiserver-oidc
  namespace: default
spec:
  virtualhost:
    fqdn: oidc-k8s.apps.somemissing.info
    tls:
      secretName: oidc-k8s-apps-somemissing-info-tls
  routes:
    - conditions:
        - prefix: /.well-known/openid-configuration
      services:
        - name: kubernetes
          port: 443
          protocol: tls
          validation:
            caSecret: kube-apiserver-ca
            subjectName: kubernetes.default
    - conditions:
        - prefix: /openid/v1/jwks
      services:
        - name: kubernetes
          port: 443
          protocol: tls
          validation:
            caSecret: kube-apiserver-ca
            subjectName: kubernetes.default
