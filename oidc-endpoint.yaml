# Public OIDC endpoint for the kube-apiserver service-account token issuer at
# https://oidc-k8s.apps.somemissing.info. DNS: public CNAME in the somemissing.info
# zone (dnsimple tofu repo); internal apps.somemissing.info record via external-dns.
# Follow-up (node-level): apiservers need an AuthenticationConfiguration whose
# anonymous.conditions covers the two paths below (k8s 1.34+ allowlist), plus
# --service-account-jwks-uri pointing here for AWS IRSA.
---
# Upstream TLS validation uses the kube-apiserver-ca Secret, copied from
# default/kube-root-ca.crt by the cm-to-secret-propagator (see
# cm-secret-propagator.yaml; Contour only reads Secrets, not ConfigMaps).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oidc-k8s-apps-somemissing-info-cert
  namespace: default
spec:
  secretName: oidc-k8s-apps-somemissing-info-tls
  issuerRef:
    name: cert-manager-webhook-dnsimple-production
    kind: ClusterIssuer
  commonName: &cn oidc-k8s.apps.somemissing.info
  dnsNames:
    - *cn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-account-issuer-discovery-anonymous
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: Group
    name: system:unauthenticated
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: kube-apiserver-oidc
  namespace: default
spec:
  virtualhost:
    fqdn: oidc-k8s.apps.somemissing.info
    tls:
      secretName: oidc-k8s-apps-somemissing-info-tls
  routes:
    - conditions:
        - prefix: /.well-known/openid-configuration
      services:
        - name: kubernetes
          port: 443
          protocol: tls
          validation:
            caSecret: kube-apiserver-ca
            subjectName: kubernetes.default
    - conditions:
        - prefix: /openid/v1/jwks
      services:
        - name: kubernetes
          port: 443
          protocol: tls
          validation:
            caSecret: kube-apiserver-ca
            subjectName: kubernetes.default
