---
# Tier 1 of the coding-agent telemetry ingest: a stateless gateway in front of
# the otel-agent-trace-connector replicas (tier 2,
# otel-agent-trace-connector.yaml). Agents reach it at
# agents-otel.k8s.somemissing.info; it terminates TLS and fans every record
# out to a tier-2 pod with consistent hashing, so the stateful parts of tier 2
# always see a whole unit of work:
#
#   - Codex/Cursor logs (carry conversation.id / cursor.conversation.id):
#     hashed on the conversation, so one turn's records meet on one pod.
#   - Everything else (all other logs, all traces): hashed on trace ID,
#     spreading load without splitting a trace. That includes Claude Code:
#     both of its edges are stateless, so a trace and the api_request logs
#     that build its chat spans need not meet on one pod (load_balancing
#     hashes a log's trace ID as hex and a span's as raw bytes, so they
#     usually do not).
#   - Metrics: hashed on stream identity, because tier 2 runs
#     delta_to_cumulative and keeps running totals per series.
#
# Topology from the connector repo's docs/multi-instance-ha.md (option B) and
# examples/k8s-ha, plus a streamID route for metrics. Stock contrib image:
# routing and load_balancing are both in it, so tier 1 needs no custom build.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
spec:
  secretName: otel-agent-trace-connector-tls
  commonName: &cn agents-otel.k8s.somemissing.info
  dnsNames:
    - *cn
  issuerRef:
    kind: ClusterIssuer
    name: cert-manager-webhook-dnsimple-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-gateway
  namespace: monitoring
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # Same agent-facing receiver the connector had before it moved behind
      # this gateway.
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            # 32 MiB (collector v0.159 renamed the byte-based
            # max_recv_msg_size). Ceiling for bursty agent deliveries; tier 2
            # accepts the same size, and the gateway never merges requests,
            # so nothing it forwards is larger than what it received.
            max_recv_msg_size_mib: 32
            tls:
              cert_file: /tls/tls.crt
              key_file: /tls/tls.key
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /tls/tls.crt
              key_file: /tls/tls.key

    processors:
      # Refuse new data (agents retry) instead of OOM-killing the pod and
      # losing everything queued below.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

    connectors:
      # Splits logs by statefulness. A record with a conversation attribute
      # (Codex, Cursor) is moved to logs/conversation; everything else falls
      # through to logs/trace. The condition reads the log record, where
      # Codex sets conversation.id, not the resource. The match is moved, so
      # a conversation record never also reaches the traceID route.
      routing:
        default_pipelines: [logs/trace]
        table:
          - condition: log.attributes["conversation.id"] != nil or log.attributes["cursor.conversation.id"] != nil
            pipelines: [logs/conversation]

    exporters:
      # Resilience is set at both levels on purpose (load_balancing README,
      # "Resilience and scaling considerations"):
      #   - per-backend (protocol.otlp): retry rides out a short blip on one
      #     pod, then gives the data back. Its queue is OFF, because a
      #     per-backend queue accepts the data and so hides the failure from
      #     the level above, pinning it to a pod that may be gone.
      #   - exporter level: the queue decouples agents from tier 2, and its
      #     retry re-hashes against the current ring, so data for a pod that
      #     left the EndpointSlice moves to a live one.
      # The queue is in memory. A graceful stop drains it
      # (terminationGracePeriodSeconds below); a crash loses what it held.
      load_balancing/conversation:
        routing_key: attributes
        routing_attributes:
          - conversation.id
          - cursor.conversation.id
        timeout: 60s
        retry_on_failure: &lb_retry
          enabled: true
          max_elapsed_time: 300s
        sending_queue: &lb_queue
          enabled: true
          sizer: bytes
          queue_size: 67108864 # 64 MiB, sized against the memory limit
        protocol: &lb_protocol
          otlp:
            # Plain gRPC inside the cluster; the NetworkPolicy on tier 2
            # admits only this gateway.
            tls:
              insecure: true
            timeout: 10s
            retry_on_failure:
              enabled: true
              max_elapsed_time: 30s
            sending_queue:
              enabled: false
        resolver: &lb_resolver
          # Watches the headless Service's EndpointSlices (RBAC below) and
          # drops endpoints that are not ready.
          k8s:
            service: otel-agent-trace-connector-headless.monitoring
            ports: [4317]
      load_balancing/trace:
        routing_key: traceID
        timeout: 60s
        retry_on_failure: *lb_retry
        sending_queue: *lb_queue
        protocol: *lb_protocol
        resolver: *lb_resolver
      load_balancing/metrics:
        routing_key: streamID
        timeout: 60s
        retry_on_failure: *lb_retry
        sending_queue: *lb_queue
        protocol: *lb_protocol
        resolver: *lb_resolver

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            # Defaults to localhost:8888, which the PodMonitor cannot reach.
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs/in:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [routing]
        logs/conversation:
          receivers: [routing]
          exporters: [load_balancing/conversation]
        logs/trace:
          receivers: [routing]
          exporters: [load_balancing/trace]
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [load_balancing/trace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [load_balancing/metrics]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent-gateway
  namespace: monitoring
---
# The k8s resolver lists and watches EndpointSlices of the tier-2 headless
# Service. Without this the resolver's endpoint list stays empty and the
# gateway routes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-agent-gateway-endpointslices
  namespace: monitoring
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-agent-gateway-endpointslices
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: otel-agent-gateway
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-agent-gateway-endpointslices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-agent-gateway
  namespace: monitoring
  annotations:
    # Roll on config edits and when cert-manager renews the cert (~every 60d).
    reloader.stakater.com/auto: "true"
spec:
  # Stateless: a roll loses nothing that agents do not resend, so a plain
  # RollingUpdate is safe here (unlike tier 2).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: otel-agent-gateway
  template:
    metadata:
      labels:
        app: otel-agent-gateway
        # Shared by both tiers; the PodMonitor selects on it.
        app.kubernetes.io/part-of: otel-agent-trace-connector
    spec:
      serviceAccountName: otel-agent-gateway
      # Time to drain the sending queue on a graceful stop.
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: otel-agent-gateway
      containers:
        - name: collector
          # renovate: datasource=docker depName=otel/opentelemetry-collector-contrib
          image: docker.io/otel/opentelemetry-collector-contrib:0.163.2
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-agent-gateway
        - name: tls
          secret:
            secretName: otel-agent-trace-connector-tls
---
# The agent-facing Service. Name, ClusterIP, and DNS record are the ones the
# single-replica connector had; only the selector moved to the gateway, so
# agents need no change.
apiVersion: v1
kind: Service
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
  labels:
    app: otel-agent-gateway
  annotations:
    # ClusterIPs are routable on the LAN (Calico advertises the Service CIDR to
    # the gateway over BGP), so a plain ClusterIP plus this annotation is all an
    # agent outside the cluster needs -- see "DNS zones and TLS" in README.md.
    external-dns.kubernetes.io/hostname: agents-otel.k8s.somemissing.info
spec:
  type: ClusterIP
  selector:
    app: otel-agent-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-agent-gateway
  namespace: monitoring
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: otel-agent-gateway
