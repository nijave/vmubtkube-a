---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: yt-dlp-media
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nfs:
    server: nas.apps.somemissing.info
    path: /media/av
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: yt-dlp-media
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Ti
  volumeName: yt-dlp-media
  storageClassName: ""
---
apiVersion: v1
kind: Service
metadata:
  name: bgutil-provider
  namespace: media
  labels:
    app.kubernetes.io/component: bgutil-provider
    app.kubernetes.io/name: yt-dlp
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 4416
    targetPort: http
  selector:
    app.kubernetes.io/component: bgutil-provider
    app.kubernetes.io/name: yt-dlp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgutil-provider
  namespace: media
  labels:
    app.kubernetes.io/component: bgutil-provider
    app.kubernetes.io/name: yt-dlp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: bgutil-provider
      app.kubernetes.io/name: yt-dlp
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bgutil-provider
        app.kubernetes.io/name: yt-dlp
    spec:
      containers:
      - name: bgutil-provider
        # renovate: datasource=docker depName=registry.apps.nickv.me/brainicism/bgutil-ytdlp-pot-provider
        image: registry.apps.nickv.me/brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
        - containerPort: 4416
          name: http
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: 64Mi
            cpu: 10m
          limits:
            memory: 512Mi
            cpu: 500m
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: yt-dlp
  namespace: media
  labels:
    app.kubernetes.io/component: yt-dlp
    app.kubernetes.io/name: yt-dlp
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: yt-dlp
            app.kubernetes.io/name: yt-dlp
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1002
            runAsGroup: 1001
          containers:
          - name: yt-dlp
            # renovate: datasource=custom.private-registry depName=registry.apps.nickv.me/nijave/yt-dlp
            image: registry.apps.nickv.me/nijave/yt-dlp:latest@sha256:22b2003d2cf8727f496262011fe1bdeffbe9bc101eb52862a323456525c6080e
            imagePullPolicy: Always
            env:
            - name: TZ
              value: Etc/UTC
            - name: MEDIA_ROOT
              value: /media
            - name: RUN_ONCE
              value: "1"
            volumeMounts:
            - name: media
              mountPath: /media
              subPath: TVShows
            resources:
              requests:
                memory: 256Mi
                cpu: 25m
              limits:
                memory: 4Gi
                cpu: 2000m
          volumes:
          - name: media
            persistentVolumeClaim:
              claimName: yt-dlp-media
