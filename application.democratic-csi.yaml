apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-stage-secret-zfs-generic-iscsi-csi-democratic-csi
  namespace: kube-system
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        node-db.node.session.auth.authmethod: CHAP
        node-db.node.session.auth.username: k8s
        node-db.node.session.auth.password: "{{ .password }}"
        # node.conn[0].timeo.* (login/noop tightening) cannot go here: Secret
        # data keys must match [-._a-zA-Z0-9]+ so brackets are rejected by the
        # API server; set those via host iscsid.conf if needed
        node-db.node.session.timeo.replacement_timeout: "30"
  data:
  - secretKey: password
    remoteRef:
      key: democratic-csi-iscsi-password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-driver-config
  namespace: kube-system
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        driver-config-file.yaml: |-
          driver: zfs-generic-iscsi
          sshConnection:
            host: nas.apps.somemissing.info
            port: 22
            username: k8s-storage
            privateKey: {{ .privateKey | toYaml | indent 2 }}
          zfs:
            cli:
              sudoEnabled: true
            # snapshots created outside democratic-csi (sanoid, etc) inherit
            # democratic-csi:managed_resource and would block DeleteVolume forever;
            # only snapshots with the property set locally/received count as managed
            deleteVolumeIgnoreForeignSnapshots: true
          
            # can be used to set arbitrary values on the dataset/zvol
            # can use handlebars templates with the parameters from the storage class/CO
            #datasetProperties:
            #  "org.freenas:description": "{{`{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}/{{ parameters.[csi.storage.k8s.io/pvc/name] }}`}}"
          
            datasetParentName: midline/k8s/pvs
            detachedSnapshotsDatasetParentName: midline/k8s/snaps
            zvolCompression: zstd-3
            zvolDedup: off
            zvolEnableReservation: false
            # 512, 1K, 2K, 4K, 8K, 16K, 64K, 128K default is 16K
            zvolBlocksize: 16K
          
          iscsi:
            shareStrategy: targetCli
            shareStrategyTargetCli:
              sudoEnabled: true
              basename: "iqn.2025-04.info.somemissing.homelab:ubthv01"
              tpg:
                attributes:
                  authentication: 1
                  generate_node_acls: 1
                  cache_dynamic_acls: 1
                  demo_mode_write_protect: 0
                auth:
                  userid: k8s
                  password: {{ .password }}
                  # mutual CHAP
                  #mutual_userid: "baz"
                  #mutual_password: "bar"
              block:
                attributes:
                  # set to 1 to enable Thin Provisioning Unmap
                  emulate_tpu: 1
            targetPortal: "172.16.1.118:3260"
            targetPortals: []       
          node:
            mount:
              checkFileSystem:
                enabled: true
                ext4:
                  enabled: true
                xfs:
                  enabled: true
            iscsi:
              sessionReaper:
                enabled: true
              # node-DB records orphaned by driver restarts/reboots/unstage
              # failures are never cleaned otherwise and lengthen every
              # iscsiadm critical section; one-shot startup sweep deletes
              # records whose target has no active session
              nodeDbSweeper:
                enabled: true
                targetBasename: "iqn.2025-04.info.somemissing.homelab:ubthv01:"
  data:
  - secretKey: privateKey
    remoteRef:
      key: democratic-csi-ssh-private-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: password
    remoteRef:
      key: democratic-csi-iscsi-password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: democratic-csi-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: democratic-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: democratic-csi
      app.kubernetes.io/csi-role: controller
  podMetricsEndpoints:
    # chart doesn't declare container ports, so target by number
    - portNumber: 8080 # external-provisioner
    - portNumber: 8081 # external-attacher
    - portNumber: 8082 # external-resizer
    - portNumber: 8083 # external-snapshotter
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
  source:
    chart: democratic-csi
    repoURL: https://democratic-csi.github.io/charts/
    targetRevision: 0.15.1
    helm:
      releaseName: democratic-csi
      valuesObject:
        csiDriver:
          name: "org.democratic-csi.iscsi"
        volumeSnapshotClasses: []
        driver:
          existingConfigSecret: democratic-csi-driver-config
          config:
            driver: ""
        controller:
          # sidecars pinned at current releases; chart 0.15.1 defaults are
          # 2023-era. The fork driver image (upstream v1.9.5 code,
          # @grpc/grpc-js server, CSI 1.0-1.11 protos) is compatible with all
          # of these, and 1.36 clears every sidecar minimum (v6 csi-provisioner
          # needs >= 1.34).
          # expose csi_sidecar_operations_seconds so controller-side CSI op
          # latency (CreateVolume, DeleteVolume, snapshots) lands in Thanos;
          # kubelet only covers node-side ops
          externalProvisioner:
            image:
              # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner
              registry: registry.k8s.io/sig-storage/csi-provisioner
              tag: v6.3.0
            extraArgs:
              - --http-endpoint=:8080
              # default 10; modest headroom for burst PVC churn (Woodpecker CI).
              # NAS sshd MaxSessions raised to 64 to absorb the concurrency;
              # kept conservative so concurrent zfs/targetcli ops don't contend.
              - --worker-threads=16
          externalAttacher:
            image:
              # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-attacher
              registry: registry.k8s.io/sig-storage/csi-attacher
              tag: v4.12.0
            extraArgs:
              - --http-endpoint=:8081
          externalResizer:
            image:
              # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer
              registry: registry.k8s.io/sig-storage/csi-resizer
              tag: v2.2.1
            extraArgs:
              - --http-endpoint=:8082
          externalSnapshotter:
            image:
              # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-snapshotter
              registry: registry.k8s.io/sig-storage/csi-snapshotter
              tag: v8.6.0
            extraArgs:
              - --http-endpoint=:8083
          driver:
            logLevel: verbose
            image:
              # renovate: datasource=custom.private-registry depName=registry.apps.nickv.me/democratic-csi/democratic-csi
              registry: registry.apps.nickv.me/democratic-csi/democratic-csi
              tag: latest
        node:
          cleanup:
            image:
              # renovate: datasource=docker depName=busybox
              registry: registry.apps.nickv.me/library/busybox
              tag: 1.38.0
          driver:
            image:
              # renovate: datasource=custom.private-registry depName=registry.apps.nickv.me/democratic-csi/democratic-csi
              registry: registry.apps.nickv.me/democratic-csi/democratic-csi
              tag: latest
          driverRegistrar:
            image:
              # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-node-driver-registrar
              registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
              tag: v2.17.0
        csiProxy:
          image:
            # renovate: datasource=docker depName=democraticcsi/csi-grpc-proxy
            registry: registry.apps.nickv.me/democraticcsi/csi-grpc-proxy
            tag: v0.5.7
        storageClasses:
          - name: zfs-generic-iscsi-csi
            defaultClass: true
            reclaimPolicy: Delete
            volumeBindingMode: Immediate
            allowVolumeExpansion: true
            parameters:
              fsType: ext4
              csi.storage.k8s.io/node-stage-secret-name: node-stage-secret-zfs-generic-iscsi-csi-democratic-csi
              csi.storage.k8s.io/node-stage-secret-namespace: kube-system
            mountOptions: []
            secrets:
              provisioner-secret:
              controller-publish-secret:
              # manually create Secret and parameter for this one
              # node-stage-secret:
              node-publish-secret:
              controller-expand-secret:
