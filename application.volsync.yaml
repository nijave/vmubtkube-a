apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: volsync-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
  source:
    repoURL: https://backube.github.io/helm-charts/
    chart: volsync
    targetRevision: 0.17.0
    helm:
      releaseName: volsync
      # Replaces the cluster's API list for this render, which drops the
      # chart's ServiceMonitor (gated only on .Capabilities; no values knob,
      # no release: prom, no bearer token). volsync-alerts.yaml ships the
      # working volsync-prom SM. The chart's only other .Capabilities check
      # (OpenShift SCC) is false either way.
      apiVersions:
        - v1/Service
      valuesObject: {}
