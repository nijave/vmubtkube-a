apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: immich
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
  source:
    repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.13.4
    helm:
      releaseName: immich
      valuesObject:
        common:
          controllers:
            main:
              containers:
                main:
                  envFrom:
                    - secretRef:
                        name: immich-postgres
        controllers:
          main:
            strategy: Recreate
            pod:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
            containers:
              main:
                image:
                  repository: ghcr.io/immich-app/immich-server
                  tag: v3.4.2
                env:
                  # v3.4.2 (immich#33450) binds the Prometheus exporter to
                  # IMMICH_HOST, default "::". The OTel exporter parses
                  # http://${host}:${port}/ per request, which is invalid for
                  # "::", so every /metrics scrape returned 400. Pod network
                  # is IPv4-only, so 0.0.0.0 also covers the API listener.
                  IMMICH_HOST: 0.0.0.0
                resources:
                  requests:
                    cpu: 50m
        immich:
          metrics:
            enabled: true
          persistence:
            library:
              existingClaim: immich
        server:
          serviceMonitor:
            main:
              labels:
                release: prom
              # chart default (app.kubernetes.io/name) would rename the job
              # from immich-server to server
              jobLabel: app.kubernetes.io/service
        machine-learning:
          enabled: true
          controllers:
            main:
              # single-attach RWO cache PVC -> avoid two pods attaching during rollout
              strategy: Recreate
              pod:
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
              containers:
                main:
                  image:
                    repository: ghcr.io/immich-app/immich-machine-learning
                    # OpenVINO variant -> Intel iGPU acceleration (matches server tag)
                    # Held at v3.4.1: upstream never published v3.4.2-openvino
                    # (release build failed); renovate.json skips v3.4.2.
                    tag: v3.4.1-openvino
                  env:
                    # Keep the CLIP model resident for fast first-search after startup.
                    # Preload names must match the active Smart Search model set in the UI.
                    MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-SO400M-16-SigLIP2-384__webli
                    MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ViT-SO400M-16-SigLIP2-384__webli
                    MACHINE_LEARNING_OPENVINO_PRECISION: FP16
                    # 0 = never unload models on inactivity (default 300s)
                    # MACHINE_LEARNING_MODEL_TTL: "0"
                  resources:
                    requests:
                      cpu: 50m
                      memory: 6Gi
                      gpu.intel.com/i915: "1"
                    limits:
                      memory: 12Gi
                      gpu.intel.com/i915: "1"
          persistence:
            cache:
              # PVC so the multi-GB model isn't re-downloaded on every pod restart
              enabled: true
              type: persistentVolumeClaim
              size: 20Gi
              accessMode: ReadWriteOnce
              # Opt out of NAS ZFS snapshots/replication for the cache PVC:
              # it holds re-downloadable model weights.
              annotations:
                democratic-csi.org/config: |
                  zfs:
                    datasetProperties:
                      homelab:sanoid-skip: "true"
                      syncoid:sync: "false"
        valkey:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: docker.io/valkey/valkey
                    tag: 9.2-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
                    pullPolicy: IfNotPresent
