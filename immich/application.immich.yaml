apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: immich
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
  source:
    repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.13.1
    helm:
      releaseName: immich
      valuesObject:
        common:
          controllers:
            main:
              containers:
                main:
                  envFrom:
                    - secretRef:
                        name: immich-postgres
        controllers:
          main:
            strategy: Recreate
            containers:
              main:
                image:
                  repository: ghcr.io/immich-app/immich-server
                  tag: v3.1.0
                resources:
                  requests:
                    cpu: 50m
        immich:
          metrics:
            enabled: true
          persistence:
            library:
              existingClaim: immich
        machine-learning:
          enabled: true
          controllers:
            main:
              # single-attach RWO cache PVC -> avoid two pods attaching during rollout
              strategy: Recreate
              containers:
                main:
                  image:
                    repository: ghcr.io/immich-app/immich-machine-learning
                    # OpenVINO variant -> Intel iGPU acceleration (matches server tag)
                    tag: v3.1.0-openvino
                  env:
                    # Keep the CLIP model resident for fast first-search after startup.
                    # Preload names must match the active Smart Search model set in the UI.
                    MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-SO400M-16-SigLIP2-384__webli
                    MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ViT-SO400M-16-SigLIP2-384__webli
                    MACHINE_LEARNING_OPENVINO_PRECISION: FP16
                    # 0 = never unload models on inactivity (default 300s)
                    # MACHINE_LEARNING_MODEL_TTL: "0"
                  resources:
                    requests:
                      cpu: 50m
                      memory: 6Gi
                      gpu.intel.com/i915: "1"
                    limits:
                      memory: 12Gi
                      gpu.intel.com/i915: "1"
          persistence:
            cache:
              # PVC so the multi-GB model isn't re-downloaded on every pod restart
              enabled: true
              type: persistentVolumeClaim
              size: 20Gi
              accessMode: ReadWriteOnce
        valkey:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: docker.io/valkey/valkey
                    tag: 9.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
                    pullPolicy: IfNotPresent
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich
  namespace: immich
  labels:
    release: prom
spec:
  jobLabel: immich-server
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: server
      app.kubernetes.io/service: immich-server
  endpoints:
    - port: metrics-api
      scheme: http
    - port: metrics-ms
      scheme: http
