apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-backup-s3
  namespace: hyperdx
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: clickhouse-backup-s3
  # Same NAS bucket and credentials as Thanos; backups live under the
  # clickhouse-backup/ prefix, which Thanos ignores (not a block ULID).
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: thanos-objectstorage-access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: thanos-objectstorage-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
