apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-backup-s3
  namespace: hyperdx
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: clickhouse-backup-s3
  # MinIO user clickhouse-backup on minio-midline (NAS), limited by the
  # clickhouse-backup-access policy to the clickhouse-backup bucket.
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: clickhouse-backup-s3-access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: clickhouse-backup-s3-secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
