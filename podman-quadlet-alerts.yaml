# Alerts for rootless Podman quadlets on hosts scraped by prometheus-ext.
#
# systemd_user_unit_state comes from node-exporter's textfile collector: a
# root timer (systemd-user-units-metrics, from the ansible repo's piiot.yml)
# lists every lingering user's user-manager services once a minute and marks
# the ones the Podman quadlet generator built (quadlet="true"). It covers
# what prometheus-podman-exporter cannot: a quadlet whose image pull failed
# has no container at all, but its unit is failed or restarting.
#
# One alert per unit: the series is per (user, name), so a host with three
# quadlets down raises three alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podman-quadlet-alerts-ext
  namespace: monitoring
  labels:
    prometheus: ext
spec:
  groups:
  - name: podman-quadlets
    rules:
    - alert: PodmanQuadletNotRunning
      annotations:
        summary: "Quadlet {{ $labels.name }} on {{ $labels.instance }} is not running."
        description: >-
          The rootless Podman quadlet {{ $labels.name }} (user
          {{ $labels.user }}) on {{ $labels.instance }} has not been active
          for 5 minutes. Check it on the host with
          systemctl --user -M {{ $labels.user }}@ status {{ $labels.name }}
          and journalctl --user -M {{ $labels.user }}@ -u {{ $labels.name }}.
      expr: systemd_user_unit_state{quadlet="true",state="active"} == 0
      for: 5m
      labels:
        severity: warning
    # The timer stopped writing the file; the states above would otherwise
    # go stale without any quadlet alert firing.
    - alert: PodmanQuadletMetricsStale
      annotations:
        summary: "Quadlet state metrics on {{ $labels.instance }} are stale."
        description: >-
          node-exporter on {{ $labels.instance }} serves a
          systemd_user_units.prom older than 10 minutes. Check
          systemd-user-units-metrics.timer on the host.
      expr: time() - node_textfile_mtime_seconds{file=~".*/systemd_user_units.prom"} > 600
      for: 5m
      labels:
        severity: warning
