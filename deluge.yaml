---
# Deluge stack migration from vmcent74deluge (Docker Compose) into the
# media namespace. Design:
# docs/superpowers/specs/2026-08-22-deluge-vm-to-k8s-design.md
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: deluge-media
spec:
  capacity:
    storage: 100Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nfs:
    server: nas.apps.somemissing.info
    path: /media/av
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: deluge-media
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Ti
  volumeName: deluge-media
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: deluge-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 40Gi
---
# The VM's live AirVPN WireGuard identity (gluetun env) from Bitwarden.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-airvpn
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        VPN_SERVICE_PROVIDER: airvpn
        SERVER_COUNTRIES: canada
        VPN_TYPE: wireguard
        WIREGUARD_IMPLEMENTATION: kernelspace
        WIREGUARD_ADDRESSES: "{{ .WIREGUARD_ADDRESSES }}"
        WIREGUARD_PRESHARED_KEY: "{{ .WIREGUARD_PRESHARED_KEY }}"
        WIREGUARD_PRIVATE_KEY: "{{ .WIREGUARD_PRIVATE_KEY }}"
  data:
  - secretKey: WIREGUARD_PRIVATE_KEY
    remoteRef:
      key: gluetun-deluge-wireguard-private-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: WIREGUARD_PRESHARED_KEY
    remoteRef:
      key: gluetun-deluge-wireguard-preshared-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: WIREGUARD_ADDRESSES
    remoteRef:
      key: gluetun-deluge-wireguard-addresses
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-repo-deluge
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        RESTIC_REPOSITORY: s3:https://vmubthh01.s.nickv.me:/volsync-deluge
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
  - secretKey: password
    remoteRef:
      key: volsync-restic-password-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: accessKey
    remoteRef:
      key: volsync-restic-repo-id-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: secretKey
    remoteRef:
      key: volsync-restic-repo-secret-1
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: deluge-data
  namespace: media
spec:
  sourcePVC: deluge-data
  trigger:
    schedule: "*/30 * * * *"
  restic:
    pruneIntervalDays: 14
    repository: restic-repo-deluge
    moverSecurityContext:
      runAsUser: 1002
      runAsGroup: 1001
      fsGroup: 1001
    retain:
      hourly: 6
      daily: 5
      weekly: 4
      monthly: 3
      yearly: 0
    copyMethod: Clone
    # clone and cache PVCs: ephemeral class keeps them out of sanoid/syncoid
    storageClassName: zfs-generic-iscsi-csi-ephemeral
    cacheStorageClassName: zfs-generic-iscsi-csi-ephemeral
---
# Web UI + exporter metrics in one Service so the existing arr
# ServiceMonitor (media.yaml, label app.kubernetes.io/name: arr) scrapes
# the metrics port — same shape as the sonarr Service.
apiVersion: v1
kind: Service
metadata:
  name: deluge
  namespace: media
  annotations:
    external-dns.kubernetes.io/hostname: deluge.k8s.somemissing.info
  labels:
    app.kubernetes.io/component: deluge
    app.kubernetes.io/name: arr
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 443
    targetPort: http
  - name: metrics
    port: 9354
    targetPort: metrics
  selector:
    app.kubernetes.io/component: deluge
    app.kubernetes.io/name: arr
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: deluge-k8s-somemissing-info-cert
  namespace: media
spec:
  secretName: deluge-k8s-somemissing-info-tls
  issuerRef:
    name: cert-manager-webhook-dnsimple-production
    kind: ClusterIssuer
  commonName: &cn deluge.k8s.somemissing.info
  dnsNames:
    - *cn
---
# deluge-web reads its TLS cert/key paths from web.conf on the config PVC
# (not env) and writes its in-memory config back on shutdown, so a one-off
# edit would not stick. LSIO runs /custom-cont-init.d scripts as root before
# the services start: repoint web.conf at the cert-manager files every boot.
# Rewrite in place (not sed -i) to keep web.conf's abc owner and mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: deluge-web-tls-init
  namespace: media
data:
  10-web-tls.sh: |
    #!/usr/bin/with-contenv bash
    f=/config/web.conf
    [ -f "$f" ] || exit 0
    new=$(sed -E \
      -e 's#("cert": )"[^"]*"#\1"/cert/tls.crt"#' \
      -e 's#("pkey": )"[^"]*"#\1"/cert/tls.key"#' "$f")
    printf '%s\n' "$new" > "$f"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  namespace: media
  labels:
    app.kubernetes.io/component: deluge
    app.kubernetes.io/name: arr
  annotations:
    # Also rolls the pod when cert-manager renews the TLS Secret; deluge-web
    # only loads the cert at startup.
    reloader.stakater.com/auto: "true"
spec:
  # Cutover commit flips this to 1 (runbook step 5); rollback scales back
  # to 0 first to release the AirVPN tunnel identity.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: deluge
      app.kubernetes.io/name: arr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: deluge
        app.kubernetes.io/name: arr
    spec:
      # No user namespace: NFS volumes do not support idmap mounts, so the
      # deluge-media PVC cannot mount under userns. Kernelspace WireGuard
      # in upstream gluetun >= v3.41 needs no /dev/net/tun, so the forked
      # image is not needed.
      # Clean session save for ~325 torrents on SIGTERM.
      terminationGracePeriodSeconds: 60
      # DNS goes through the tunnel (POC pattern); ndots=1 keeps
      # single-label names from getting search-suffixed.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.4.4
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      # Native sidecar running the AirVPN tunnel; the app containers share
      # its netns. startupProbe gates their start until the tunnel is up.
      - name: gluetun
        image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        restartPolicy: Always
        env:
        - name: LOG_LEVEL
          value: info
        # The WireGuard backend reads WIREGUARD_MTU; VPN_MTU is OpenVPN-only
        # and ignored here. 1320 mirrors the VM's wg-quick config.
        - name: WIREGUARD_MTU
          value: "1320"
        - name: HEALTH_SERVER_ADDRESS
          value: "0.0.0.0:9999"
        - name: HEALTH_TARGET_ADDRESSES
          value: cloudflare.com:443,google.com:443
        # In-cluster traffic to the Service DNATs into the netns and
        # traverses gluetun's INPUT chain; without these allows every
        # scrape blackholes. Health server, web UI, exporter metrics.
        - name: FIREWALL_INPUT_PORTS
          value: "9999,8112,9354"
        # AirVPN forwarded port for incoming peer traffic (locked at 59836;
        # verify with the AirVPN port checker during cutover before any arr
        # client is repointed).
        - name: FIREWALL_VPN_INPUT_PORTS
          value: "59836"
        # Mirrors the VM's off-tunnel exemptions: NAS, node/pod/service
        # ranges, Contour LB VIPs.
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 172.16.0.0/22,192.168.208.0/20,192.168.224.0/20,192.168.240.0/28
        envFrom:
        - secretRef:
            name: gluetun-airvpn
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        startupProbe:
          httpGet:
            path: /
            port: 9999
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 20
        livenessProbe:
          httpGet:
            path: /
            port: 9999
          periodSeconds: 30
          failureThreshold: 5
        # Readiness: a failing tunnel takes the pod NotReady (startup and
        # liveness alone would just restart gluetun).
        readinessProbe:
          httpGet:
            path: /
            port: 9999
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 256Mi
            cpu: 500m
      containers:
      - name: deluge
        image: lscr.io/linuxserver/deluge:latest@sha256:33a939576f7ecfc1227db1a0cb2afce030ce983e620ec9d93c956e3700e21fe9
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: "1002"
        - name: PGID
          value: "1001"
        ports:
        - containerPort: 8112
          name: http
          protocol: TCP
        # deluge-web serves TLS (web.conf https: true) with the Let's
        # Encrypt cert from deluge-k8s-somemissing-info-tls.
        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTPS
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTPS
          initialDelaySeconds: 5
        volumeMounts:
        # Migrated VM state lands at /config (LSIO runs deluged with
        # -c /config); exact /media path parity keeps fastresumes valid.
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: tls
          mountPath: /cert
          readOnly: true
        - name: tls-init
          mountPath: /custom-cont-init.d
          readOnly: true
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 4Gi
            cpu: 2000m
      - name: deluge-exporter
        image: docker.io/tobbez/deluge_exporter:latest@sha256:a1995ade221157cb77723cc60eb38c425804e383adc11ae95cc3f9364dca64ee
        ports:
        - containerPort: 9354
          name: metrics
          protocol: TCP
        # Whole config volume read-only at /root/.config/deluge (deluge
        # state lives directly in /config); talks to deluged over
        # localhost, so no cross-pod RPC hole through gluetun's firewall.
        # Metric names unchanged -> TooManyPausedTorrents unaffected.
        volumeMounts:
        - name: config
          mountPath: /root/.config/deluge
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            # 250m throttled (CPUThrottlingHigh) scraping ~325 torrents.
            cpu: 1000m
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: deluge-data
      - name: media
        persistentVolumeClaim:
          claimName: deluge-media
      # 0440 + fsGroup 1001: deluge-web (abc, gid 1001) can read tls.key.
      - name: tls
        secret:
          secretName: deluge-k8s-somemissing-info-tls
          defaultMode: 0440
      - name: tls-init
        configMap:
          name: deluge-web-tls-init
          defaultMode: 0755
