---
# unpackerr extracts archived torrent downloads for sonarr and radarr: it
# polls their queues and unpacks completed items under /media/torrents
# (rTorrent's download directory on the NAS export) so the arr can import
# them. SABnzbd unpacks its own downloads. Not tied to any download client.
#
# Prerequisites in Bitwarden: sonarr-api-key and radarr-api-key.
#
# unpackerr gets its own binding to the NAS export; it mounts only the
# torrents/ subtree (see subPath below). Capacity is advisory on static PVs.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: unpackerr-media
spec:
  capacity:
    storage: 100Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nfs:
    server: nas.apps.somemissing.info
    path: /media/av
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
  name: unpackerr-media
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Ti
  volumeName: unpackerr-media
  storageClassName: ""
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-sonarr
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        UN_SONARR_0_API_KEY: "{{ .apiKey }}"
  data:
  - secretKey: apiKey
    remoteRef:
      key: sonarr-api-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-radarr
  namespace: media
spec:
  refreshInterval: 300s
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      data:
        UN_RADARR_0_API_KEY: "{{ .apiKey }}"
  data:
  - secretKey: apiKey
    remoteRef:
      key: radarr-api-key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: media
  labels:
    app.kubernetes.io/component: unpackerr
    app.kubernetes.io/name: arr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: unpackerr
      app.kubernetes.io/name: arr
  template:
    metadata:
      labels:
        app.kubernetes.io/component: unpackerr
        app.kubernetes.io/name: arr
    spec:
      securityContext:
        runAsUser: 1002
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: unpackerr
        image: docker.io/golift/unpackerr:latest@sha256:4ec141eeb0cb2f971d7c92f21cc40b0d2d50d7920eb7a0557443cca52270c0b0
        env:
        - name: TZ
          value: Etc/UTC
        - name: UN_DEBUG
          value: "true"
        - name: UN_SONARR_0_URL
          value: http://sonarr.media.svc.cluster.local
        - name: UN_SONARR_0_PATHS_0
          value: /media/torrents
        - name: UN_RADARR_0_URL
          value: http://radarr.media.svc.cluster.local
        - name: UN_RADARR_0_PATHS_0
          value: /media/torrents
        envFrom:
        - secretRef:
            name: unpackerr-sonarr
        - secretRef:
            name: unpackerr-radarr
        # subPath torrents: the PVC serves the export root /media/av, and a
        # bare mount would nest paths as /media/torrents/torrents/... so
        # arr-provided paths wouldn't resolve. No config PVC (stateless).
        volumeMounts:
        - name: media
          mountPath: /media/torrents
          subPath: torrents
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 500m
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: unpackerr-media
---
# Evaluated by the internal kube-prometheus rule set (label release: prom —
# where kube-state-metrics series live).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unpackerr-guardrails
  namespace: monitoring
  labels:
    release: prom
spec:
  groups:
  - name: unpackerr
    rules:
    - alert: UnpackerrPodUnavailable
      annotations:
        summary: unpackerr has no ready pods.
        description: >-
          deploy/unpackerr -n media has fewer ready replicas than desired,
          so completed archives stopped being unpacked for sonarr and
          radarr. Check 'kubectl describe pod -l
          app.kubernetes.io/component=unpackerr -n media' and restart with
          'kubectl rollout restart deploy/unpackerr -n media'.
      expr: |
        kube_deployment_status_replicas_ready{namespace="media",deployment="unpackerr"}
          < kube_deployment_spec_replicas{namespace="media",deployment="unpackerr"}
      for: 10m
      labels:
        severity: warning
