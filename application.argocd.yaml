apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: argocd-secret
    jqPathExpressions:
    - .data
    - .stringData
    - .metadata.labels
    - .metadata.annotations
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.4.2
    helm:
      releaseName: argocd
      valuesObject:
        applicationSet:
          replicas: 0
        configs:
          secret:
            createSecret: false
          cm:
            resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
              jqPathExpressions:
              - .spec.preserveUnknownFields
            resource.customizations.ignoreDifferences.apps_StatefulSet: |
              jqPathExpressions:
              - .spec.volumeClaimTemplates[].metadata.creationTimestamp
            # Every Secret value committed to this repo is the placeholder
            # base64 `++++++++`; the real values are filled in-cluster by
            # secret-generator, CNPG or ESO. Argo owns the Secret shell, never
            # its contents -- without this, a full sync writes placeholders over
            # live credentials (Postgres, ClickHouse, Mongo, CSI, Grafana).
            # `_Secret` is the core (empty) API group; a bare `Secret` key would
            # silently never match.
            # Opt a Secret back into git-managed values with:
            #   k8s.somemissing.info/argocd-manage-secret-data: "true"
            resource.customizations.ignoreDifferences._Secret: |
              jqPathExpressions:
              - 'if (.metadata.annotations."k8s.somemissing.info/argocd-manage-secret-data" // "") == "true" then empty else (.data, .stringData) end'
            resource.trackingmethod: annotation
            resource.customizations.health.postgresql.cnpg.io_Cluster: |
              hs = {}
              if obj.status ~= nil and obj.status.phase ~= nil then
                if obj.status.phase == "Cluster in healthy state" then
                  hs.status = "Healthy"
                  hs.message = obj.status.phase
                elseif obj.status.phase == "Setting up primary" or obj.status.phase == "Creating a new replica" or obj.status.phase == "Upgrading cluster" then
                  hs.status = "Progressing"
                  hs.message = obj.status.phase
                else
                  hs.status = "Degraded"
                  hs.message = obj.status.phase
                end
              else
                hs.status = "Progressing"
                hs.message = "Waiting for status"
              end
              return hs
            resource.customizations.health.clickhouse.altinity.com_ClickHouseInstallation: |
              hs = {}
              if obj.status ~= nil and obj.status.status ~= nil then
                if obj.status.status == "Completed" then
                  hs.status = "Healthy"
                  hs.message = "ClickHouse installation completed"
                elseif obj.status.status == "InProgress" then
                  hs.status = "Progressing"
                  hs.message = "ClickHouse installation in progress"
                else
                  hs.status = "Degraded"
                  hs.message = "ClickHouse status: " .. obj.status.status
                end
              else
                hs.status = "Progressing"
                hs.message = "Waiting for status"
              end
              return hs
            resource.customizations.health.mongodbcommunity.mongodb.com_MongoDBCommunity: |
              hs = {}
              if obj.status ~= nil and obj.status.phase ~= nil then
                if obj.status.phase == "Running" then
                  hs.status = "Healthy"
                  hs.message = "MongoDB replica set is running"
                elseif obj.status.phase == "Pending" then
                  hs.status = "Progressing"
                  hs.message = obj.status.message or "MongoDB replica set is being provisioned"
                elseif obj.status.phase == "Failed" then
                  hs.status = "Degraded"
                  hs.message = obj.status.message or "MongoDB replica set has failed"
                else
                  hs.status = "Progressing"
                  hs.message = obj.status.phase
                end
              else
                hs.status = "Progressing"
                hs.message = "Waiting for status"
              end
              return hs
            # PodDisruptionBudgets that select Job pods (cukk-upgrade-pods in
            # kube-system, see cukk.yaml) are permanently DisruptionAllowed=False
            # / reason=SyncFailed because jobs.batch does not implement the
            # scale subresource, so the disruption controller can never compute
            # a budget while cukk's retained (terminal) upgrade Job pods exist.
            # The built-in PDB health check maps that to Degraded, and the sync
            # operation's post-apply health assessment fails the whole root-app
            # sync on it -- the ignore-healthcheck annotation alone only covers
            # app-health aggregation, not the sync wait
            # (argoproj/argo-cd#22940, still open). This override makes the
            # annotation also short-circuit the health assessment used during
            # sync; PDBs without the annotation keep the exact built-in
            # behavior (replicated below from ArgoCD v3.5.2 -- re-sync this
            # copy if the built-in check ever changes upstream).
            resource.customizations.health.policy_PodDisruptionBudget: |
              hs = {}
              if obj.metadata ~= nil and obj.metadata.annotations ~= nil and obj.metadata.annotations["argocd.argoproj.io/ignore-healthcheck"] == "true" then
                hs.status = "Healthy"
                hs.message = "Health ignored by annotation"
                return hs
              end
              hs.status = "Progressing"
              hs.message = "Waiting for status"
              if obj.status ~= nil then
                if obj.status.conditions ~= nil then
                  for i, condition in ipairs(obj.status.conditions) do
                    -- InsufficientPods can have valid use cases
                    if condition.status == "False" and condition.reason ~= "InsufficientPods" then
                      hs.status = "Degraded"
                      hs.message = "PodDisruptionBudget has " .. condition.reason
                      return hs
                    else
                      hs.status = "Healthy"
                      hs.message = "PodDisruptionBudget has " .. condition.reason
                    end
                  end
                end
              end
              return hs
            resource.customizations.health.volsync.backube_ReplicationSource: |
              hs = {}
              if obj.status ~= nil then
                if obj.status.conditions ~= nil then
                  for i, condition in ipairs(obj.status.conditions) do
                    if condition.type == "Synchronizing" and condition.status == "True" then
                      hs.status = "Progressing"
                      hs.message = condition.message or "Synchronization in progress"
                      return hs
                    end
                    if condition.type == "Synchronizing" and condition.status == "False" and condition.reason == "Error" then
                      hs.status = "Degraded"
                      hs.message = condition.message or "Synchronization error"
                      return hs
                    end
                  end
                end
                if obj.status.lastSyncTime ~= nil then
                  hs.status = "Healthy"
                  hs.message = "Last sync: " .. obj.status.lastSyncTime
                  return hs
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for first synchronization"
              return hs
          params:
            otlp.address: otel-collector.k8s.somemissing.info:4317
            otlp.insecure: "false"
            controller.resource.health.persist: "true"
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              additionalLabels:
                release: prom
              enabled: true
          replicas: 1
        dex:
          enabled: false
        redis:
          exporter:
            enabled: true
          metrics:
            enabled: true
            serviceMonitor:
              additionalLabels:
                release: prom
              enabled: true
        redis-ha:
          enabled: false
        repoServer:
          autoscaling:
            enabled: true
            minReplicas: 1
          # requests are required for the HPA's memory/cpu utilization metric;
          # without them the HPA reports "missing request for memory" and the
          # argocd app shows Degraded. Sized from observed ~57Mi / <5m usage.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          metrics:
            enabled: true
            serviceMonitor:
              additionalLabels:
                release: prom
              enabled: true
        server:
          autoscaling:
            enabled: true
            minReplicas: 1
          # requests are required for the HPA's memory/cpu utilization metric;
          # without them the HPA reports "missing request for memory" and the
          # argocd app shows Degraded. Sized from observed ~69Mi / <5m usage.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          certificate:
            additionalHosts:
            - argocd.k8s.somemissing.info
          metrics:
            enabled: true
            serviceMonitor:
              additionalLabels:
                release: prom
              enabled: true
          service:
            annotations:
              external-dns.kubernetes.io/hostname: argocd.k8s.somemissing.info
