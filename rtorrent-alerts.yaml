# Alert rules for the rtorrent stack, evaluated by the in-cluster
# kube-prometheus (label release: prom), which scrapes svc/rtorrent-metrics
# in media through the rtorrent-metrics ServiceMonitor in rtorrent.yaml.
#
# 2026-08-15 incident context (on the VM): rtorrent's event loop wedged
# between 02:02 (last successful RPC2 response) and 02:04 UTC (first 504).
# The process kept listening on its SCGI socket but never accept()ed, so the
# exporter's /metrics hung too — surfacing as up == 0 rather than any
# rtorrent_* gauge going stale. A container restart recovered it. In-pod, the
# equivalent is 'kubectl rollout restart deploy/rtorrent -n media'.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rtorrent-alerts
  namespace: monitoring
  labels:
    release: prom
spec:
  groups:
  - name: rtorrent
    rules:
    - alert: RtorrentExporterScrapeFailing
      annotations:
        summary: rtorrent-exporter is not scrapeable.
        description: >-
          The rtorrent-exporter scrape has failed for 10m. When rtorrent's
          SCGI event loop wedges (2026-08-15: frozen 02:02-14:40 UTC) the
          exporter's /metrics hangs with it and reads as down; the same alert
          covers exporter crashes and a missing pod. Check RPC2 health with
          'kubectl exec -n media deploy/rtorrent -c rtorrent -- curl -s -o
          /dev/null -w "%{http_code}" http://127.0.0.1:5000/RPC2 -d
          "<methodCall><methodName>system.client_version</methodName></methodCall>"'.
          A 504 means rtorrent itself is wedged; restart with
          'kubectl rollout restart deploy/rtorrent -n media'.
      # absent() covers the pod being gone: the ServiceMonitor target
      # disappears instead of reporting up == 0.
      expr: up{job="rtorrent-metrics"} != 1 or absent(up{job="rtorrent-metrics"})
      for: 10m
      labels:
        severity: critical
    - alert: RtorrentNoProgressWithIncomplete
      annotations:
        summary: rtorrent has incomplete downloads but no download progress for 6h.
        description: >-
          rtorrent_downloads_incomplete > 0 while cumulative downloaded bytes
          have not moved in 6h. Either everything genuinely has no available
          peers, or rtorrent is partially wedged while still serving RPC.
          Check the gluetun sidecar logs (VPN path, forwarded port 16312) and
          tracker state in Flood before restarting.
      # download_total_bytes is per torrent (info_hash/name labels) while
      # downloads_incomplete is not, so sum by job before matching; a bare
      # `and` never finds a label match. Summing by job also spans a pod
      # restart inside the window.
      expr: |
        sum by (job) (rtorrent_downloads_incomplete) > 0
          and on (job)
        sum by (job) (increase(rtorrent_downloads_download_total_bytes[6h])) == 0
      for: 30m
      labels:
        severity: warning
