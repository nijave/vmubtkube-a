# Unit tests for rustfs-alerts.yaml (CI cache, namespace woodpecker) and
# rustfs-ha-alerts.yaml (HA instance, namespace rustfs). Both instances export
# the same rustfs_* metric names, so every test feeds series from both
# namespaces and checks that neither instance can hide or trigger the other's
# alerts. Run: sh .ci/validate-prom-rules.sh (rule_files paths are
# <namespace>/<metadata.name>.yaml of the extracted PrometheusRule).
rule_files:
  - monitoring/rustfs-ci-cache.yaml
  - monitoring/rustfs-ha.yaml
evaluation_interval: 1m
tests:
  # Both instances healthy: nothing fires. Raw total is twice usable total on
  # the HA instance (EC:2), and usage sits at 50% of usable.
  - name: both healthy, nothing fires
    interval: 1m
    input_series:
      - series: 'rustfs_runtime_readiness_ready{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '1+0x180'
      - series: 'rustfs_capacity_current_bytes{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '1e9+0x180'
      - series: 'rustfs_cluster_capacity_used_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '250e9+0x180'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '500e9+0x180'
      - series: 'rustfs_cluster_capacity_raw_total_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '1000e9+0x180'
      - series: 'rustfs_cluster_health_drives_offline_count{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '0+0x180'
      - series: 'kube_statefulset_status_replicas_ready{namespace="rustfs",statefulset="rustfs"}'
        values: '4+0x180'
    alert_rule_test:
      - {eval_time: 3h, alertname: CICacheMetricsMissing, exp_alerts: []}
      - {eval_time: 3h, alertname: CICacheNotReady, exp_alerts: []}
      - {eval_time: 3h, alertname: CICacheVolumeNearlyFull, exp_alerts: []}
      - {eval_time: 3h, alertname: RustfsHAMetricsMissing, exp_alerts: []}
      - {eval_time: 3h, alertname: RustfsHAPodsNotReady, exp_alerts: []}
      - {eval_time: 3h, alertname: RustfsHAWriteQuorumLost, exp_alerts: []}
      - {eval_time: 3h, alertname: RustfsHADriveOffline, exp_alerts: []}
      - {eval_time: 3h, alertname: RustfsHACapacity, exp_alerts: []}

  # The regression this file exists for: the CI cache is dead (no woodpecker
  # series at all) while the HA instance is healthy. Before the namespace
  # matcher, the HA series kept absent() quiet.
  - name: healthy HA series do not hide a dead CI cache
    interval: 1m
    input_series:
      - series: 'rustfs_cluster_capacity_used_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '250e9+0x180'
      - series: 'rustfs_runtime_readiness_ready{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '1+0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: CICacheMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning, namespace: woodpecker}
            exp_annotations:
              summary: CI cache metrics have been missing for an hour
              description: "No rustfs_* series. Either the rustfs pod, its OTLP sidecar, or the scrape is broken; CI still passes but every pipeline pays the full download cost again."
      - {eval_time: 2h, alertname: RustfsHAMetricsMissing, exp_alerts: []}

  # The mirror case: the HA collector is gone, the CI cache is healthy.
  - name: healthy CI cache series do not hide missing HA metrics
    interval: 1m
    input_series:
      - series: 'rustfs_runtime_readiness_ready{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '1+0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: RustfsHAMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning, namespace: rustfs}
            exp_annotations:
              summary: HA rustfs metrics have been missing for an hour
              description: "No rustfs_* series from namespace rustfs. Check the rustfs-metrics collector Deployment, its PodMonitor, and the RUSTFS_OBS_* settings; drive and capacity alerts are blind until this clears."
      - {eval_time: 2h, alertname: CICacheMetricsMissing, exp_alerts: []}

  # An unready HA pod reports readiness 0 under the same metric name the CI
  # cache rule reads. It must not page as the CI cache.
  - name: HA readiness and restarts do not fire CI cache alerts
    interval: 1m
    input_series:
      - series: 'rustfs_runtime_readiness_ready{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '1+0x180'
      - series: 'rustfs_runtime_readiness_ready{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '0+0x180'
      - series: 'rustfs_start_total{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '0+1x180'
    alert_rule_test:
      - {eval_time: 2h, alertname: CICacheNotReady, exp_alerts: []}
      - {eval_time: 2h, alertname: CICacheRestartLooping, exp_alerts: []}

  # Capacity. The CI cache is over its 8.6e9 threshold; the HA instance is at
  # 45% of usable. Then the reverse. The HA usable total (500e9) differs from
  # raw (1000e9), so a rule dividing by raw would read 0.45 where usable reads
  # 0.9 and fail the second half.
  - name: CI cache full does not fire HA capacity
    interval: 1m
    input_series:
      - series: 'rustfs_capacity_current_bytes{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '9e9+0x180'
      - series: 'rustfs_cluster_capacity_used_bytes{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '9e9+0x180'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '10e9+0x180'
      - series: 'rustfs_cluster_capacity_used_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '225e9+0x180'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '500e9+0x180'
      - series: 'rustfs_cluster_capacity_raw_total_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '1000e9+0x180'
    alert_rule_test:
      - {eval_time: 3h, alertname: RustfsHACapacity, exp_alerts: []}
      - eval_time: 3h
        alertname: CICacheVolumeNearlyFull
        exp_alerts:
          - exp_labels: {severity: warning, namespace: woodpecker, exported_job: rustfs-ci-cache}
            exp_annotations:
              summary: CI cache volume is over 80% of its 10Gi PVC
              description: "Old chart and tool versions accumulate; prune them or grow the PVC before writes start failing."

  - name: HA at 90 percent of usable fires HA capacity only
    interval: 1m
    input_series:
      - series: 'rustfs_capacity_current_bytes{namespace="woodpecker",exported_job="rustfs-ci-cache"}'
        values: '1e9+0x180'
      # rustfs also exports this name on the HA instance, far above the CI
      # cache's absolute threshold.
      - series: 'rustfs_capacity_current_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '450e9+0x180'
      - series: 'rustfs_cluster_capacity_used_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '450e9+0x180'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '500e9+0x180'
      - series: 'rustfs_cluster_capacity_raw_total_bytes{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '1000e9+0x180'
      # A second reporting pod sees the same cluster totals; the alert must
      # still be a single one.
      - series: 'rustfs_cluster_capacity_used_bytes{namespace="rustfs",exported_instance="10.0.0.2"}'
        values: '450e9+0x180'
      - series: 'rustfs_cluster_capacity_usable_total_bytes{namespace="rustfs",exported_instance="10.0.0.2"}'
        values: '500e9+0x180'
    alert_rule_test:
      - {eval_time: 3h, alertname: CICacheVolumeNearlyFull, exp_alerts: []}
      - eval_time: 3h
        alertname: RustfsHACapacity
        exp_alerts:
          - exp_labels: {severity: warning, namespace: rustfs}
            exp_annotations:
              summary: HA rustfs is over 80% of its usable capacity
              description: "Usable capacity is 90% full. Every byte stored costs two on the shared NAS pool; expand all four PVCs together or remove data."

  # Pod count: 3 ready is a warning only; 2 ready is also critical.
  - name: three ready pods warn, two ready pods are critical
    interval: 1m
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="rustfs",statefulset="rustfs"}'
        values: '3+0x60 2+0x60'
      # A different StatefulSet in another namespace with one replica must not
      # match.
      - series: 'kube_statefulset_status_replicas_ready{namespace="thanos",statefulset="thanos-compact"}'
        values: '1+0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: RustfsHAPodsNotReady
        exp_alerts:
          - exp_labels: {severity: warning, namespace: rustfs, statefulset: rustfs}
            exp_annotations:
              summary: HA rustfs has fewer than 4 ready pods
              description: "3 of 4 rustfs pods are ready. The service still reads and writes on 3, but a second loss stops writes. If a node is down for good, follow the failed-node procedure in README.md."
      - {eval_time: 30m, alertname: RustfsHAWriteQuorumLost, exp_alerts: []}
      - eval_time: 80m
        alertname: RustfsHAWriteQuorumLost
        exp_alerts:
          - exp_labels: {severity: critical, namespace: rustfs, statefulset: rustfs}
            exp_annotations:
              summary: HA rustfs has lost write quorum
              description: "2 of 4 rustfs pods are ready; writes need 3."

  - name: offline drive and restart loop
    interval: 1m
    input_series:
      - series: 'rustfs_cluster_health_drives_offline_count{namespace="rustfs",exported_instance="10.0.0.1"}'
        values: '1+0x60'
      - series: 'rustfs_cluster_health_drives_offline_count{namespace="rustfs",exported_instance="10.0.0.2"}'
        values: '1+0x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="rustfs",pod="rustfs-2",container="rustfs"}'
        values: '0+1x60'
      # The collector restarting is not a rustfs restart loop.
      - series: 'kube_pod_container_status_restarts_total{namespace="rustfs",pod="rustfs-metrics-abc",container="otel-collector"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: RustfsHADriveOffline
        exp_alerts:
          - exp_labels: {severity: warning, namespace: rustfs}
            exp_annotations:
              summary: HA rustfs reports an offline drive
              description: "1 of 4 drives are offline according to rustfs itself."
      - eval_time: 40m
        alertname: RustfsHARestartLooping
        exp_alerts:
          - exp_labels: {severity: warning, namespace: rustfs, pod: rustfs-2, container: rustfs}
            exp_annotations:
              summary: "HA rustfs pod rustfs-2 is restarting repeatedly"
