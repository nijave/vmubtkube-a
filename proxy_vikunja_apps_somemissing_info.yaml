# Public, mTLS-fronted entrypoint for Vikunja: Envoy terminates the client
# cert and the ext_authz federator exchanges it for a Vikunja bearer (see
# python-envoy-authz docs/federation.md). Mirrors the frigate proxy. The
# plain-HTTP LAN endpoint (vikunja.k8s.somemissing.info) is unaffected.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vikunja-apps-somemissing-info-cert
  namespace: default
spec:
  secretName: vikunja-apps-somemissing-info-tls
  issuerRef:
    name: cert-manager-webhook-dnsimple-production
    kind: ClusterIssuer
  commonName: &cn vikunja.apps.somemissing.info
  dnsNames:
    - *cn
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: vikunja-apps-somemissing-info
  namespace: default
spec:
  virtualhost:
    fqdn: vikunja.apps.somemissing.info
    tls:
      secretName: vikunja-apps-somemissing-info-tls
      clientValidation:
        caSecret: ca-ha-homelab-somemissing-info-tls
        # Certless requests get a clean 401 from ext_authz instead of a failed
        # TLS handshake.
        optionalClientCertificate: true
    authorization:
      extensionRef:
        name: python-envoy-authz
        namespace: projectcontour
      # Required: the OAuth token/refresh legs are matched on the POST body,
      # which only reaches Check when with_request_body is set (federation.md).
      withRequestBody:
        maxRequestBytes: 8192
        allowPartialMessage: true
        packAsBytes: false
  routes:
    - conditions:
        - prefix: /
      services:
        - name: vikunja
          port: 80
      timeoutPolicy:
        response: 1h
      enableWebsockets: true
