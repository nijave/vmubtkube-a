# Mirrors images referenced as registry.apps.nickv.me/<path>:<tag> from their
# upstream registries. See .ci/mirror-images.sh for the mapping logic; upstream
# coordinates come entirely from renovate.json (registryAliases, packageRules,
# ignoreDeps), so the mirror path must equal the upstream repo path.
#
# Runs on PRs so Renovate's tag bumps mirror the new image before merge, and on
# push to main as a self-healing backstop (re-mirrors anything missing).
#
# Step DAG (depends_on): prepare builds the two caches (.tmp/schemas,
# .tmp/charts) in the workspace; validate, validate-helm, and
# validate-prom-selectors wait for it and then read them. validate-pluto is
# independent (it shells out to kubectl only, no schemas). vendir-sync waits for
# the steps that read vendored/ (it rewrites those files in the shared
# workspace); mirror-images and vendir-push both wait for vendir-sync
# (mirror-images git-diffs the same workspace; vendir-push, PR-only, pushes
# vendir-sync's commit back to the PR branch with the deploy key).
clone:
  git:
    # renovate: datasource=docker depName=woodpeckerci/plugin-git
    image: woodpeckerci/plugin-git:2.12.1
    settings:
      partial: false
      # Shallow clone of HEAD's recent history. mirror-images.sh fetches the
      # target branch separately to compute diffs; if a long-lived PR's
      # merge-base falls outside these depths, the script's explicit git-diff
      # check will fail loudly rather than silently producing empty mirror sets.
      depth: 25

when:
  - event: pull_request
#  - event: push
#    branch: main

steps:
  cache-restore:
    # renovate: datasource=docker depName=rclone/rclone
    image: rclone/rclone:1.76
    # Cache misses are normal and rustfs is a single pod: never fail the run
    # because the cache was unavailable (see .ci/cache-restore.sh).
    failure: ignore
    environment:
      RCLONE_CONFIG_CICACHE_TYPE: s3
      RCLONE_CONFIG_CICACHE_PROVIDER: Other
      RCLONE_CONFIG_CICACHE_ENDPOINT: http://rustfs.woodpecker.svc.cluster.local
      RCLONE_CONFIG_CICACHE_REGION: us-east-1
      RCLONE_CONFIG_CICACHE_FORCE_PATH_STYLE: "true"
      # Woodpecker repo secrets (values from the rustfs-ci-cache Secret; the
      # cache is not security-sensitive but nothing else may reach the API).
      RCLONE_CONFIG_CICACHE_ACCESS_KEY_ID:
        from_secret: cache_access_key
      RCLONE_CONFIG_CICACHE_SECRET_ACCESS_KEY:
        from_secret: cache_secret_key
    commands:
      - sh .ci/cache-restore.sh

  prepare:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    depends_on: [cache-restore]
    # Single writer for the caches the validating steps read, so neither of them
    # pays for a 734 MB schema clone or ~27 chart downloads, and neither races
    # the other into the same git repositories or tarball paths (see
    # .ci/prepare-cache.sh).
    environment:
      # git-mirror the schema repos instead of per-URL downloads from the
      # flaky raw.githubusercontent.com CDN (see .ci/sync-schemas.sh)
      SCHEMA_MIRROR: .tmp/schemas
      HELM_CHART_CACHE: .tmp/charts
    commands:
      - sh .ci/prepare-cache.sh

  cache-save:
    # renovate: datasource=docker depName=rclone/rclone
    image: rclone/rclone:1.76
    depends_on: [prepare]
    failure: ignore
    environment:
      RCLONE_CONFIG_CICACHE_TYPE: s3
      RCLONE_CONFIG_CICACHE_PROVIDER: Other
      RCLONE_CONFIG_CICACHE_ENDPOINT: http://rustfs.woodpecker.svc.cluster.local
      RCLONE_CONFIG_CICACHE_REGION: us-east-1
      RCLONE_CONFIG_CICACHE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_CICACHE_ACCESS_KEY_ID:
        from_secret: cache_access_key
      RCLONE_CONFIG_CICACHE_SECRET_ACCESS_KEY:
        from_secret: cache_secret_key
    commands:
      - sh .ci/cache-save.sh

  validate:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    depends_on: [prepare]
    environment:
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
      # git-mirror the schema repos instead of per-URL downloads from the
      # flaky raw.githubusercontent.com CDN (see .ci/sync-schemas.sh)
      SCHEMA_MIRROR: .tmp/schemas
    commands:
      - wget -q -t 3 -T 30 -O- "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - sh .ci/validate.sh

  validate-pluto:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    environment:
      # renovate: datasource=github-releases depName=FairwindsOps/pluto
      PLUTO_VERSION: v5.24.0
    commands:
      - wget -q -t 3 -T 30 -O- "https://github.com/FairwindsOps/pluto/releases/download/$PLUTO_VERSION/pluto_$${PLUTO_VERSION#v}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin pluto
      - sh .ci/validate-pluto.sh

  validate-helm:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    depends_on: [prepare]
    when:
      - event: pull_request
        # Any manifest can hold a Helm-source Application.
        path:
          - "**/*.yaml"
          - ".ci/validate-helm.sh"
    environment:
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
      # renovate: datasource=github-releases depName=FairwindsOps/pluto
      PLUTO_VERSION: v5.24.0
      # see validate step
      SCHEMA_MIRROR: .tmp/schemas
      HELM_CHART_CACHE: .tmp/charts
    commands:
      - wget -q -t 3 -T 30 -O- "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - wget -q -t 3 -T 30 -O- "https://github.com/FairwindsOps/pluto/releases/download/$PLUTO_VERSION/pluto_$${PLUTO_VERSION#v}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin pluto
      - sh .ci/validate-helm.sh

  validate-prom-selectors:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    depends_on: [prepare]
    # No `when:` path filter: any manifest can add, fix, or orphan a
    # monitoring resource (and the rendered Helm Applications feed the check).
    environment:
      # renders every Helm Application, like validate-helm
      HELM_CHART_CACHE: .tmp/charts
    commands:
      - sh .ci/validate-prom-selectors.sh

  vendir-sync:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    # No `when:` filter: mirror-images depends_on this step, and Woodpecker
    # rejects a DAG whose dependency is filtered out by conditions. The
    # equivalent gating (PR event + vendir file changes) lives in the script.
    # This step no longer references the deploy-key secret: an event-scoped
    # (pull_request) secret referenced from an always-on step errors the whole
    # pipeline on push events at compile time. The push moved to vendir-push.
    depends_on: [validate, validate-pluto]
    environment:
      # renovate: datasource=github-releases depName=carvel-dev/vendir
      VENDIR_VERSION: v0.46.0
    commands:
      - wget -q -t 3 -T 30 -O /usr/local/bin/vendir "https://github.com/carvel-dev/vendir/releases/download/$VENDIR_VERSION/vendir-linux-amd64"
      - chmod +x /usr/local/bin/vendir
      - sh .ci/vendir-sync.sh

  vendir-push:
    # renovate: datasource=docker depName=alpine/k8s
    image: alpine/k8s:1.37.2
    # Gated to pull_request so the PR-only deploy-key secret is never evaluated
    # on push events. Nothing depends_on this step, so filtering it out on push
    # keeps the DAG valid. vendir-sync signals it via .tmp/vendir-push-needed.
    when:
      - event: pull_request
    depends_on: [vendir-sync]
    environment:
      # Write-access GitHub deploy key for pushing sync results back to the
      # PR branch. Woodpecker repo secret scoped to this image + pull_request.
      VENDIR_PUSH_SSH_KEY:
        from_secret: vendir_push_ssh_key
    commands:
      - sh .ci/vendir-push.sh

  mirror-images:
    # renovate: datasource=docker depName=ghcr.io/regclient/regctl
    image: ghcr.io/regclient/regctl:v0.11.7-alpine
    depends_on: [vendir-sync]
    backend_options:
      kubernetes:
        hostUsers: false
        # regclient image runs as non-root; need root to apk add yq/jq.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
    commands:
      # dl-cdn.alpinelinux.org is a third-party service on the critical path of
      # every run; one retry is enough to absorb its transient failures.
      - apk add --no-cache yq jq git || (sleep 10 && apk add --no-cache yq jq git)
      - sh .ci/mirror-images.sh
