apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.40.0
# Fetch whole upstream operator release bundles atomically. Renovate's vendir
# manager bumps the tag/ref fields below; Woodpecker CI runs `vendir sync` on
# PR branches and commits the updated vendored/*/base files. Never hand-edit base/.
directories:
  - path: vendored/cnpg/base
    contents:
      - path: .
        githubRelease:
          slug: cloudnative-pg/cloudnative-pg
          tag: v1.30.0
          assetNames: ["cnpg-*.yaml"]
          disableAutoChecksumValidation: true   # checksums ship in a release asset, not parseable from notes

  - path: vendored/barman-cloud-plugin/base
    contents:
      - path: .
        githubRelease:
          slug: cloudnative-pg/plugin-barman-cloud   # NOT cloudnative-pg-plugin-barman-cloud
          tag: v0.14.0
          assetNames: ["manifest.yaml"]               # upstream renamed from barman-cloud-plugin-*.yaml
          disableAutoChecksumValidation: true          # release ships no checksum file

  - path: vendored/cert-manager/base
    contents:
      - path: .
        githubRelease:
          slug: cert-manager/cert-manager
          tag: v1.21.1
          assetNames: ["cert-manager.yaml"]
          disableAutoChecksumValidation: true   # same as above; lock file still pins the digest

  - path: vendored/contour/base
    contents:
      - path: .
        git:
          url: https://github.com/projectcontour/contour
          ref: v1.33.6
        newRootPath: examples/render
        includePaths:
          - examples/render/contour.yaml   # full pre-re-root path; vendir applies includePaths before newRootPath

  - path: vendored/external-secrets-crds/base
    contents:
      - path: .
        # CRD-only. The githubRelease asset is the full external-secrets.yaml
        # (controller + RBAC), which would double-deploy alongside the Helm
        # chart. Source the bundled CRDs from git at the tag matching chart 2.7.0.
        git:
          url: https://github.com/external-secrets/external-secrets
          ref: v2.9.0
        newRootPath: deploy/crds
        includePaths:
          - deploy/crds/bundle.yaml

  - path: vendored/kubelet-rubber-stamp/base
    contents:
      - path: .
        git:
          url: https://github.com/nijave/kubelet-rubber-stamp
          ref: v0.4.0
        newRootPath: deploy
        includePaths:
          - deploy/service_account.yaml
          - deploy/role.yaml
          - deploy/role_binding.yaml
          - deploy/operator.yaml

  - path: vendored/vpa/base
    contents:
      - path: .
        # Recommendation-only VPA: CRDs + RBAC + recommender. The updater and
        # admission-controller are intentionally not vendored — all VPA objects
        # run updateMode: Off, and the admission-controller would need a
        # TLS cert secret this repo doesn't manage.
        git:
          url: https://github.com/kubernetes/autoscaler
          ref: vertical-pod-autoscaler/v1.6.0
        newRootPath: vertical-pod-autoscaler/deploy
        includePaths:
          - vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
          - vertical-pod-autoscaler/deploy/vpa-rbac.yaml
          - vertical-pod-autoscaler/deploy/recommender-deployment.yaml

  - path: vendored/metrics-server/base
    contents:
      - path: .
        githubRelease:
          slug: kubernetes-sigs/metrics-server
          tag: v0.9.0
          assetNames: ["high-availability.yaml"]
          disableAutoChecksumValidation: true   # checksums ship in a release asset, not parseable from notes

  # go-vikunja/helm-chart is a thin bjw-s `common` wrapper. OCI publishing
  # (ghcr.io) stalled at chart 2.0.0, so vendor the chart from git tags to keep
  # it Renovate-updatable. The Vikunja app version is pinned via
  # vikunja.image.tag in application.vikunja.yaml, NOT the chart's appVersion —
  # bump the chart tag and the common helmChart entry below together
  # (Chart.lock pins the common version this chart expects).
  #
  # vendir can't fetch straight into vendored/vikunja/base: that directory also
  # needs the `common` subchart (vendored separately below) and Helm requires
  # subcharts to live physically under the parent chart's charts/, but each
  # vendir-managed directory is fully wiped and replaced on every sync, so
  # nesting one inside the other would let either sync silently delete the
  # other's output (vendir also rejects this outright as an overlapping path).
  #
  # So this entry fetches into a plain upstream/ staging directory instead, and
  # vendored/vikunja/base is a plain, non-vendir directory of symlinks (see
  # vendored/vikunja/base/*) pointing into upstream/ and into
  # vendored/bjw-s-common/base below. Since base/ is never a vendir-managed
  # path, sync never touches it — no CI relinking step needed.
  - path: vendored/vikunja/upstream
    contents:
      - path: .
        git:
          url: https://github.com/go-vikunja/helm-chart
          ref: v2.0.2
        includePaths:
          - Chart.yaml
          - Chart.lock
          - values.yaml
          - templates/**
        excludePaths:
          # helm-unittest fixtures, not manifests — the chart's .helmignore
          # strips /templates/tests when packaging; git vendoring bypasses that,
          # so exclude them here or helm renders a kind-less doc.
          - templates/tests/**

  # The chart repo commits only Chart.lock, not its charts/ dependency — vendor
  # `common` as its own directory (see vendored/vikunja/upstream comment above
  # for why it can't live under vendored/vikunja/base directly).
  # vendored/vikunja/base/charts/common is a symlink to this directory.
  - path: vendored/bjw-s-common/base
    contents:
      - path: .
        helmChart:
          name: common
          version: 1.5.1
          repository:
            url: https://bjw-s-labs.github.io/helm-charts
