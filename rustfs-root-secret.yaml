# Root credentials for the HA rustfs (application.rustfs.yaml). The key names
# are the environment variable names rustfs reads. Kept at the repo root, out
# of the chart's extraManifests, so a chart re-render never touches it.
# Administration only: each consumer gets its own rustfs user and policy.
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-root
  namespace: rustfs
  annotations:
    # Hex so the values never need URL escaping in an S3 endpoint URL.
    secret-generator.v1.mittwald.de/autogenerate: RUSTFS_ACCESS_KEY,RUSTFS_SECRET_KEY
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
