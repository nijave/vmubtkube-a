apiVersion: v1
kind: Secret
metadata:
  name: thanos-store-caching-bucket
  namespace: thanos
  annotations:
    # Config (no credentials) lives in git; opt out of argocd-cm's global
    # Secret .data ignoreDifferences so edits reach the cluster.
    k8s.somemissing.info/argocd-manage-secret-data: "true"
type: Opaque
stringData:
  cache.yaml: |
    type: MEMCACHED
    config:
      addresses:
      - "dns+caching-bucket-memcached.thanos.svc.cluster.local:11211"
      dns_provider_update_interval: "10s"
      max_item_size: "1MiB"
      timeout: "500ms"
      max_idle_connections: 100
      max_async_concurrency: 20
      max_async_buffer_size: 10000
      max_get_multi_concurrency: 100
      max_get_multi_batch_size: 0