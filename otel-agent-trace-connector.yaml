---
# Coding-agent telemetry ingest (github.com/nijave/otel-agent-trace-connector).
#
# A custom OCB-built Collector distribution carrying the `coding_agent`
# connector, which turns Codex's structured OTLP logs into one trace per user
# turn and normalizes Claude Code's native span tree (with chat spans built
# from its api_request/api_error log events) into the same canonical
# vocabulary:
#
#   invoke_agent <agent>
#   ├── chat <model>
#   └── execute_tool <tool>
#
# This is tier 2 of a two-tier setup. Agents point at
# agents-otel.k8s.somemissing.info, which is the tier-1 gateway
# (otel-agent-gateway.yaml); the gateway hashes each conversation, trace, and
# metric stream onto one of the replicas below through the headless Service.
# Raw vendor telemetry and the canonical traces are both forwarded to
# otel-collector.k8s.somemissing.info -- the same collector projectcontour's
# otel-collector forwards to.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # Only the tier-1 gateway sends here, over plain gRPC inside the
      # cluster (TLS for agents ends at the gateway; the NetworkPolicy below
      # admits nothing else).
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            # 32 MiB (collector v0.159 renamed the byte-based
            # max_recv_msg_size). Ceiling for bursty agent deliveries, which
            # the gateway forwards unmerged; sized together with the pod
            # memory limit below, since an inbound message is decompressed in
            # full before the pipeline can gate it.
            max_recv_msg_size_mib: 32

    connectors:
      # Two instances of the same component: `coding_agent` sits on the logs
      # pipeline and `coding_agent/claude` on the traces pipeline. Each builds
      # every edge for its signal, so both get the same config through the
      # &coding_agent anchor; claude_code.chat_source must match on every
      # instance that sees Claude Code logs or traces, and the anchor stops
      # the two from drifting.
      coding_agent: &coding_agent
        # Codex: stateful correlation of codex.* logs into one trace per turn.
        # A turn with a response.completed event is finalized once
        # reorder_window is quiet; one without is finalized by turn_timeout.
        # signals: [logs] (also the default, stated so it is not missed)
        # means the Codex native-traces edge is not built: native spans from
        # a client with trace_exporter set are forwarded raw only, so a turn
        # never gets a second canonical trace. The logs edge is the one with
        # TTFT and failed-call chat spans.
        codex:
          signals: [logs]
          turn_timeout: 10m
          reorder_window: 30s
          max_active_turns: 500
          max_events_per_turn: 1000
        # Cursor: unused here, but its logs edge is always constructed and
        # holds its own turn state, so it gets the same bounds as Codex.
        # max_active_turns bounds memory per edge -- 500 is generous for a
        # handful of concurrent agents and keeps the worst case well inside
        # the pod's memory limit (the upstream README's 10000 assumes a far
        # larger fleet).
        cursor:
          turn_timeout: 10m
          reorder_window: 30s
          max_active_turns: 500
          max_events_per_turn: 1000
        # Claude Code: chat spans come from the claude_code.api_request /
        # api_error log events instead of the native claude_code.llm_request
        # span, which the traces edge then drops. Only the logs carry
        # per-request cost (coding_agent.usage.cost), and api_error gives
        # failed requests an Error chat span with the retry attempt. The
        # interaction and tool spans still come from the native span tree,
        # so Claude Code must export both logs and traces.
        claude_code:
          chat_source: logs
      coding_agent/claude: *coding_agent

    processors:
      # Tags everything this collector forwards so the downstream collector can
      # exempt it from tail sampling. Applied on both the ingest pipelines and
      # the canonical pipeline: the connectors copy the resource through, but
      # tagging the output too means the exemption holds regardless of how a
      # future connector version builds its resource.
      resource/coding_agent:
        attributes:
          - key: telemetry.source
            value: coding-agent
            action: upsert
      batch:
        # Both values keep an export well under the 4 MiB gRPC message limit
        # on every hop to otel-collector. At 1024 spans, fat agent batches
        # reach ~5 MB and ResourceExhausted is permanent -- exporterhelper
        # drops them outright (~14k spans/hour observed).
        # send_batch_size triggers a send; send_batch_max_size additionally
        # splits a single large delivery into multiple capped exports, so no
        # outgoing batch exceeds 64 spans even when one OTLP request arrives
        # far larger. The cap is per-item, not per-byte: ~5 KB/span observed
        # leaves ample headroom.
        send_batch_size: 16
        send_batch_max_size: 64
        timeout: 5s
      # Claude Code exports delta temporality by default, and
      # prometheus_remote_write drops delta sums and histograms (only
      # target_info used to reach Thanos). This converts them to cumulative
      # before export. It keeps accumulation state in memory per series, so
      # every point of a series must reach the same pod -- the gateway's
      # load_balancing/metrics exporter routes on streamID for exactly that.
      # When the replica set changes a stream can still move; each pod then
      # writes it under its own collector_replica label (exporter below), so
      # every series a pod writes stays monotonic.
      delta_to_cumulative:

    exporters:
      otlp_grpc:
        endpoint: otel-collector.k8s.somemissing.info:4317
        tls:
          insecure: false
      # Metrics diverge from the logs/traces path: instead of the second hop
      # to otel-collector (which keeps `metrics: null`), remote-write straight
      # to Thanos Receive -- the same URL kube-prometheus-stack and
      # prometheus-ext use; the receive router has no auth.
      prometheus_remote_write:
        # Under `http:`: top-level HTTP client settings are deprecated since
        # collector v0.158, and the alpha feature gate
        # exporter.prometheusremotewritexporter.removeTopLevelHTTPSettings
        # rejects them once it is enabled.
        http:
          endpoint: http://thanos-receive-router.thanos.svc.cluster.local.:19291/api/v1/receive
        # Resource attrs as labels: without this, claude-code/codex series are
        # indistinguishable in Thanos (service.name) and the coding-agent tag
        # (telemetry.source) never arrives. included: ["*"] is the documented
        # replacement for the deprecated resource_to_telemetry_conversion
        # enabled: true and copies every resource attribute the same way.
        resource_constant_labels:
          included: ["*"]
        # Each replica writes its own series. delta_to_cumulative keeps a
        # running total per series and pod; without this label, a series
        # that moves to the other pod and back within max_stale resumes the
        # old pod's stale total in the *same* series, and increase()
        # over-counts by that total. Queries aggregate it away:
        # sum without (collector_replica) (increase(...)). external_labels rather
        # than a resource attribute keeps the pod name off the OTLP data and
        # covers every series, target_info included. collector_replica is not a
        # label any agent sends.
        external_labels:
          collector_replica: ${env:COLLECTOR_REPLICA}

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            # Defaults to localhost:8888, which the ServiceMonitor cannot reach.
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        # Raw vendor telemetry is forwarded as-is alongside the canonical
        # traces, so the original Codex logs and Claude Code spans stay
        # queryable in HyperDX.
        logs/vendor:
          receivers: [otlp]
          processors: [resource/coding_agent, batch]
          exporters: [otlp_grpc, coding_agent]
        traces/native:
          receivers: [otlp]
          processors: [resource/coding_agent, batch]
          exporters: [otlp_grpc, coding_agent/claude]
        traces/canonical:
          receivers: [coding_agent, coding_agent/claude]
          processors: [resource/coding_agent, batch]
          exporters: [otlp_grpc]
        # OTLP metrics ride the same receiver as logs/traces but remote-write
        # to Thanos instead of forwarding to otel-collector (whose
        # `metrics: null` stands, so the downstream contract is unchanged).
        # Agent metric volume is low; `batch` is reused as-is -- its 16/64
        # sizing was tuned for the 4 MiB gRPC hop, which this HTTP export is
        # not subject to. delta_to_cumulative runs before batch so
        # remote write only ever sees cumulative series.
        metrics/agents:
          receivers: [otlp]
          processors: [resource/coding_agent, delta_to_cumulative, batch]
          exporters: [prometheus_remote_write]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
  annotations:
    # Roll on config edits.
    reloader.stakater.com/auto: "true"
spec:
  # Two replicas behind the gateway's consistent hash. The Codex/Cursor side
  # still holds each turn in memory, so a pod that stops flushes its active
  # turns with finish reason `shutdown`, and every change to the replica set
  # (a pod leaving or a new pod IP joining) moves part of the hash ring, which
  # can split a turn that spans the change. One pod at a time, no surge:
  # each roll moves the ring as few times as possible while the other pod
  # keeps serving. See docs/coding-agent-traces.md for what a restart loses.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: otel-agent-trace-connector
  template:
    metadata:
      labels:
        app: otel-agent-trace-connector
        # Shared by both tiers; the PodMonitor selects on it.
        app.kubernetes.io/part-of: otel-agent-trace-connector
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: otel-agent-trace-connector
      containers:
        - name: collector
          # renovate: datasource=docker depName=ghcr.io/nijave/otel-agent-trace-connector
          image: ghcr.io/nijave/otel-agent-trace-connector:v0.9.0-beta.1
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          env:
            # collector_replica label on remote-written series (see config).
            - name: COLLECTOR_REPLICA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-agent-trace-connector
---
# Headless, so the gateway's k8s resolver sees each pod's address (from the
# EndpointSlices) and hashes onto pods, not onto one ClusterIP. No
# external-dns annotation: agents reach tier 2 only through the gateway.
apiVersion: v1
kind: Service
metadata:
  name: otel-agent-trace-connector-headless
  namespace: monitoring
  labels:
    app: otel-agent-trace-connector
spec:
  clusterIP: None
  selector:
    app: otel-agent-trace-connector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
---
# Pod IPs are reachable from the LAN like Service IPs, so close tier 2 to
# everything except the gateway (OTLP) and Prometheus (self-metrics). Kubelet
# probes from the node are always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: otel-agent-trace-connector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-agent-gateway
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8888
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: otel-agent-trace-connector
---
# Scrapes both tiers. jobLabel takes the job name from each pod's `app`
# label, so the connector keeps job="otel-agent-trace-connector" and the
# gateway reports as job="otel-agent-gateway"
# (otel-agent-trace-connector-alerts.yaml selects on both).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: otel-agent-trace-connector
  namespace: monitoring
  labels:
    release: prom
spec:
  jobLabel: app
  selector:
    matchLabels:
      app.kubernetes.io/part-of: otel-agent-trace-connector
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
